<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Histoire — 4·2</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="brand.css?v=20261118q2">
  <link rel="stylesheet" href="fonts.css?v=20261118f1">

  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --accent: #e6b89c;
      --paper: #ffffff;
      --background: #ffffff;
      --surface: #f5f5f7;
      --line: #d2d2d7;
      --nav: rgb(255 255 255 / 86%);
      --on-primary: #ffffff;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --bad: #b91c1c;
      --bad-bg: #fee2e2;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --ink: #f5f5f7;
        --muted: #a1a1a6;
        --accent: #e6b89c;
        --paper: #000000;
        --background: #000000;
        --surface: #1d1d1f;
        --line: #48484a;
        --nav: rgb(0 0 0 / 86%);
        --on-primary: #1d1d1f;
        --ok: #4ade80;
        --ok-bg: rgb(21 128 61 / 22%);
        --bad: #f87171;
        --bad-bg: rgb(185 28 28 / 22%);
      }
      #brand-home .brand-mark,
      #brand-home .brand-tool { color: #f5f5f7; }
    }

    * { box-sizing: border-box; }
    button, input, select, textarea { font: inherit; color: inherit; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--ink);
      font: 15px/1.55 "Pretendard Variable", "Pretendard", -apple-system,
        BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Single-viewport layout on desktop */
    @media (min-width: 860px) {
      body.viewport-fit {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      body.viewport-fit .workspace {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding-bottom: 16px;
      }
      body.viewport-fit #mainView {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      body.viewport-fit .split-card {
        flex: 1;
        min-height: 0;
      }
    }

    .page-header {
      flex: none;
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--nav);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      max-width: 1160px;
      margin: 0 auto;
      padding: 6px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    #brand-home { text-decoration: none; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 980px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--line);
      white-space: nowrap;
    }
    .stat-pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
    .stat-pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }

    .progress-thin {
      height: 2px;
      width: 100%;
      background: var(--surface);
    }
    .progress-thin-fill {
      height: 100%;
      background: var(--ink);
      transition: width 250ms ease;
    }

    .workspace {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 14px 0 40px;
    }

    .toolbar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .mode-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button.pill-btn {
      appearance: none;
      min-height: 36px;
      padding: 6px 14px;
      border-radius: 980px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 140ms ease;
    }
    button.pill-btn:hover { border-color: var(--ink); color: var(--ink); }
    button.pill-btn.active {
      background: var(--ink);
      color: var(--on-primary);
      border-color: var(--ink);
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filters select,
    .filters input[type="text"] {
      min-height: 36px;
      padding: 4px 10px;
      border-radius: 980px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 13px;
    }

    .check-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 36px;
      padding: 4px 12px;
      border-radius: 980px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .btn {
      appearance: none;
      min-height: 38px;
      padding: 7px 15px;
      border-radius: 980px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--surface); border-color: var(--ink); }
    .btn.primary { background: var(--ink); color: var(--on-primary); border-color: var(--ink); }
    .btn.primary:hover:not(:disabled) { opacity: 0.88; background: var(--ink); }
    .btn.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
    .btn.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Quizlet-style clickable card */
    .quizlet-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      min-height: 0;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    .quizlet-stage {
      flex: 1;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: border-color 150ms ease, transform 120ms ease;
    }

    .quizlet-stage:hover {
      border-color: var(--ink);
    }

    .quizlet-stage:active {
      transform: scale(0.995);
    }

    .quizlet-front-photo {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    .quizlet-front-photo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .quizlet-tap-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 980px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    .quizlet-back {
      padding: 24px;
      background: var(--paper);
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }

    .quizlet-back-head {
      display: grid;
      gap: 4px;
    }

    .quizlet-back-year {
      font-family: "Instrument Sans", sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }

    .quizlet-back-name {
      margin: 0;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }

    .quizlet-back-arch {
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
    }

    /* 2-Column Single-Viewport Card */
    .split-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      display: grid;
      grid-template-columns: 1.18fr 1fr;
      gap: 20px;
      overflow: hidden;
    }

    .split-card.no-media {
      grid-template-columns: 1fr;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    .media-pane {
      position: relative;
      min-height: 260px;
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .media-pane img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      cursor: zoom-in;
    }

    .media-fallback {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .media-fallback a {
      display: inline-block;
      margin-top: 8px;
      color: var(--ink);
      font-weight: 600;
    }

    .content-pane {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
      gap: 12px;
    }

    .content-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .chapter-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 980px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .counter {
      font-family: "Instrument Sans", sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .project-title {
      margin: 0 0 6px;
      font-size: clamp(20px, 2.4vw, 26px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .sub-hint {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .field-stack {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .field-row label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .field-row input {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 14px;
    }

    .options-grid {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 10px 13px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: border-color 120ms ease, background-color 120ms ease;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--ink); background: var(--surface); }

    .option-key {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--muted);
      font-family: "Instrument Sans", sans-serif;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .option-btn.correct { border-color: var(--ok); background: var(--ok-bg); }
    .option-btn.correct .option-key { background: var(--ok); color: #fff; }
    .option-btn.wrong { border-color: var(--bad); background: var(--bad-bg); }
    .option-btn.wrong .option-key { background: var(--bad); color: #fff; }

    .answer-box {
      padding: 12px;
      border-radius: 12px;
      background: var(--surface);
      display: grid;
      gap: 8px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .meta-item {
      background: var(--paper);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    .meta-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .meta-val {
      font-size: 13px;
      font-weight: 600;
      margin-top: 2px;
    }

    .desc-fr {
      font-size: 13.5px;
      line-height: 1.55;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--paper);
      border: 1px solid var(--line);
    }

    .ko-tip {
      font-size: 12.5px;
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
      background: var(--paper);
    }

    .card-actions {
      flex: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .kbd-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Scrollable list modes (Exam / Pairs / All 30) */
    .grid-list { display: grid; gap: 12px; }
    .pairs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
    }
    .pair-card, .exam-card, .list-row {
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--paper);
    }
    .pair-card h3 { margin: 0 0 6px; font-size: 15px; }
    .pair-card p { margin: 0; font-size: 13.5px; color: var(--muted); }

    .list-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 14px;
      align-items: start;
    }
    .list-thumb {
      width: 120px;
      height: 84px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }
    .list-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    /* Lightbox modal */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 10px;
      object-fit: contain;
    }

    @media (max-width: 859px) {
      .split-card {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .media-pane {
        height: 220px;
        min-height: 220px;
      }
      .list-row { grid-template-columns: 1fr; }
      .list-thumb { width: 100%; height: 160px; }
      .stat-pill.bad { display: none; }
    }
  </style>
</head>
<body class="viewport-fit">
  <header class="page-header">
    <div class="nav-inner">
      <a id="brand-home" class="product-name" href="https://atelier-4-2.github.io/site/" aria-label="4·2 홈으로">
        <span class="brand-mark">4·2</span><span class="brand-divider" aria-hidden="true"></span><span class="brand-tool">Histoire</span>
      </a>
      <div class="nav-right">
        <span class="stat-pill ok" id="statMastered">암기 0/30</span>
        <span class="stat-pill bad" id="statReview">복습 0</span>
        <nav class="site-switch" aria-label="Atelier 4·2 사이트 전환">
          <a href="https://atelier-4-2.github.io/site/">Terrain</a>
          <a href="./" aria-current="page">Histoire</a>
        </nav>
      </div>
    </div>
    <div class="progress-thin"><div class="progress-thin-fill" id="progressFill" style="width:0%"></div></div>
  </header>

  <main class="workspace">
    <div class="toolbar">
      <div class="mode-tabs" id="modeTabs">
        <button class="pill-btn active" data-mode="flashcard">플래시카드</button>
        <button class="pill-btn" data-mode="quiz">4지선다</button>
        <button class="pill-btn" data-mode="photo">사진 퀴즈</button>
        <button class="pill-btn" data-mode="exam">실전 3문제</button>
        <button class="pill-btn" data-mode="pairs">헷갈리는 6쌍</button>
        <button class="pill-btn" data-mode="list">전체 30개</button>
      </div>
      <div class="filters" id="filtersBar"></div>
    </div>

    <section id="mainView"></section>
  </main>

  <div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
    <img id="lightboxImg" src="" alt="확대 이미지">
  </div>

  <script>
    const PROJECTS = [
      { id: 1, chapter: "#1 Crise du Mouvement moderne", name: "Pruitt-Igoe", architect: "Minoru Yamasaki", location: "St. Louis, États-Unis", year: "1950 (슬라이드), démolition 1972", desc: "Grand ensemble de logements sociaux, application radicale du fonctionnalisme. Dégradation rapide, démoli en 1972 : symbole de l'échec du modernisme.", koTip: "기능주의의 급진적 적용 → 빠른 노후화 → 1972년 폭파 철거 (모더니즘 실패의 상징).", img: "images/01.jpg" },
      { id: 2, chapter: "#1 Crise du Mouvement moderne", name: "Robin Hood Gardens", architect: "Alison & Peter Smithson (Team 10)", location: "Londres, Poplar", year: "1972", desc: "Logement social expérimental, « streets in the sky ». Tentative d'humaniser le modernisme, résultats mitigés, démoli récemment.", koTip: "Smithson 부부 (Team 10) · '하늘 길(streets in the sky)' · Byker Wall과 구분!", img: "images/02.jpg" },
      { id: 3, chapter: "#1 Crise du Mouvement moderne", name: "Byker Wall", architect: "Ralph Erskine", location: "Newcastle, Royaume-Uni", year: "1982", desc: "Logement social participatif : les habitants intègrent le processus. Architecture adaptée au contexte local (climat), alternative au grand ensemble.", koTip: "주민 참여형(participatif) + 북쪽 바람 막는 긴 벽(기후 적응).", img: "images/03.jpg" },
      { id: 4, chapter: "#1 Crise du Mouvement moderne", name: "Espaces d'Abraxas", architect: "Ricardo Bofill (Taller de Arquitectura)", location: "Noisy-le-Grand, France", year: "1983", desc: "Logement monumental, réintroduction de formes classiques. Critique du fonctionnalisme, architecture comme décor, ambiguïté entre utopie et spectacle.", koTip: "파리 근교(Noisy-le-Grand), 고전 기둥·아치 형태의 거대 기념비적 주거 (Walden 7과 구분!).", img: "images/04.jpg" },
      { id: 5, chapter: "#1 Crise du Mouvement moderne", name: "Habitat 67", architect: "Moshe Safdie", location: "Montréal, Canada (Expo 67)", year: "1967", desc: "Prototype de logement modulaire expérimental. Réponse critique aux grands ensembles : densité compatible avec la qualité de vie.", koTip: "몬트리올 엑스포 67 · 프리패브 모듈러 적층 주거.", img: "images/05.jpg" },
      { id: 6, chapter: "#1 Crise du Mouvement moderne", name: "Siedlung Halen", architect: "Atelier 5", location: "près de Berne, Suisse", year: "1961", desc: "Logement dense intégré au paysage (pente, forêt), échelle humaine. Alternative au grand ensemble, projet durable dans le temps.", koTip: "베른 근처 경사지·숲에 통합된 고밀 저층 주거, 인간적 스케일.", img: "images/06.jpg" },
      { id: 7, chapter: "#1 Crise du Mouvement moderne", name: "PREVI", architect: "concours international (Aldo van Eyck, James Stirling, Atelier 5, Georges Candilis, Charles Correa…)", location: "Lima, Pérou", year: "1970", desc: "Projet expérimental de logement évolutif : les habitants agrandissent leur maison. Critique du modèle standardisé.", koTip: "국제 공모 · 거주자가 스스로 증축하는 진화형(évolutif) 주거.", img: "images/07.jpg" },
      { id: 8, chapter: "#1 Crise du Mouvement moderne", name: "La Grande Motte", architect: "Jean Balladur", location: "Hérault (Languedoc), France", year: "1970", desc: "Station balnéaire planifiée (Mission Racine), pyramides répétitives et iconiques. Modernisme touristique tardif, logique sérielle et économique.", koTip: "Mission Racine 계획 휴양 도시 · 반복되는 피라미드 매스.", img: "images/08.jpg" },
      { id: 9, chapter: "#1 Crise du Mouvement moderne", name: "Nakagin Capsule Tower", architect: "Kisho Kurokawa", location: "Tokyo (Ginza)", year: "1972 (démolie en 2022)", desc: "Projet métaboliste : capsules d'habitation remplaçables fixées sur deux noyaux. Vision évolutive de la ville. Démolie en 2022.", koTip: "교체 가능한 캡슐 + 2개의 코어 (메타볼리즘, 2022년 철거).", img: "images/09.jpg" },
      { id: 10, chapter: "#2 Postmodernismes", name: "Guild House", architect: "Robert Venturi (& John Rauch)", location: "Philadelphie, États-Unis", year: "1963", desc: "Logement pour personnes âgées, façade volontairement banale, antenne TV comme symbole. Référence ironique au modernisme : projet critique fondateur (« decorated shed »).", koTip: "노인 주거 · 의도적으로 평범한 입면 + TV 안테나 상징 ('decorated shed').", img: "images/10.jpg" },
      { id: 11, chapter: "#2 Postmodernismes", name: "Piazza d'Italia", architect: "Charles Moore", location: "La Nouvelle-Orléans, États-Unis", year: "1978", desc: "Espace public scénographique pour la communauté italienne. Colonnes et arcs antiques en néon et inox, couleurs : architecture ludique et narrative.", koTip: "이탈리아계 커뮤니티 광장 · 네온·스테인리스로 재해석한 고전 기둥과 아치.", img: "images/11.jpg" },
      { id: 12, chapter: "#2 Postmodernismes", name: "Teatro del Mondo", architect: "Aldo Rossi", location: "Venise (Biennale 1980)", year: "1980", desc: "Théâtre flottant temporaire en bois sur une barge. Formes archétypales simples, mémoire urbaine de Venise : architecture comme artefact.", koTip: "베니스 비엔날레 수상 목조 가설 극장 · 원형적 형태와 도시의 기억.", img: "images/12.jpg" },
      { id: 13, chapter: "#2 Postmodernismes", name: "Sony Tower (AT&T Building)", architect: "Philip Johnson & John Burgee", location: "New York, Madison Avenue", year: "1984", desc: "Gratte-ciel au sommet en fronton brisé « Chippendale ». Citation historique explicite, architecture-signe, postmodernisme corporate.", koTip: "치펜데일(Chippendale) 부서진 박공 지붕 · 기업형 포스트모더니즘.", img: "images/13.jpg" },
      { id: 14, chapter: "#2 Postmodernismes", name: "Walden 7", architect: "Ricardo Bofill", location: "Sant Just Desvern, près de Barcelone", year: "1975", desc: "Logements expérimentaux, organisation labyrinthique autour de cours. Référence aux formes méditerranéennes, couleur et monumentalité.", koTip: "바르셀로나 근교 · 붉은 미로형 중정 집합주택 (Abraxas보다 먼저, 1975).", img: "images/14.jpg" },
      { id: 15, chapter: "#2 Postmodernismes", name: "Kanchanjunga Apartments", architect: "Charles Correa", location: "Mumbai, Inde", year: "1983", desc: "Tour de logements adaptée au climat tropical : jardins suspendus à double hauteur, orientation ouest. Hybridation modernisme / tradition (véranda).", koTip: "뭄바이 고층 주거 · 2층 높이 공중 정원(베란다의 현대적 번역) · 서향 바람.", img: "images/15.jpg" },
      { id: 16, chapter: "#3 Régionalisme critique", name: "New Gourna", architect: "Hassan Fathy", location: "Gourna, près de Louxor, Égypte", year: "1970 (슬라이드)", desc: "Village en terre crue, voûtes et coupoles nubiennes. Techniques vernaculaires, adaptation climatique, architecture sociale, refus du modernisme importé.", koTip: "생흙(흙벽돌) + 누비아식 볼트·돔 · 수입 모더니즘 거부.", img: "images/16.jpg" },
      { id: 17, chapter: "#3 Régionalisme critique", name: "Hôtel de ville de Säynätsalo", architect: "Alvar Aalto", location: "Säynätsalo, Finlande", year: "1952", desc: "Bâtiment civique en brique organisé autour d'une cour surélevée. Relation au paysage, échelle humaine, modernité organique : précurseur du régionalisme critique.", koTip: "벽돌 시청사 + 들어 올려진 중정 · 비판적 지역주의의 선구자.", img: "images/17.jpg" },
      { id: 18, chapter: "#3 Régionalisme critique", name: "Azuma House (Row House Sumiyoshi)", architect: "Tadao Ando", location: "Osaka, Japon", year: "1976", desc: "Maison en béton introvertie, cour centrale ouverte au ciel. Travail sur la lumière et le vide, minimalisme contextuel.", koTip: "노출 콘크리트 · 외부에 닫히고 하늘로 열린 중정(빛과 비움).", img: "images/18.jpg" },
      { id: 19, chapter: "#3 Régionalisme critique", name: "Chapelle Saint-Benoît", architect: "Peter Zumthor", location: "Sumvitg, Grisons, Suisse", year: "1989", desc: "Église en bois (plan en goutte d'eau) intégrée au paysage alpin. Matériaux locaux, forme compacte, architecture sensorielle.", koTip: "물방울 평면 목조 예배당 · 알프스 지역 재료와 감각적 건축.", img: "images/19.jpg" },
      { id: 20, chapter: "#3 Régionalisme critique", name: "Assemblée nationale du Koweït", architect: "Jørn Utzon", location: "Koweït City", year: "1972 (슬라이드; achevée 1982)", desc: "Inspirée de formes vernaculaires (tente, souk), grande toiture-auvent. Adaptation au climat désertique, hybridation culturelle hors d'Europe.", koTip: "유촌(Utzon) · 베두인 텐트·수크(시장)에서 영감 받은 거대 캐노피 지붕.", img: "images/20.jpg" },
      { id: 21, chapter: "#3 Régionalisme critique", name: "Parlement du Bangladesh (Jatiya Sangsad)", architect: "Louis Kahn", location: "Dacca, Bangladesh", year: "1982", desc: "Projet monumental de formes géométriques simples (cercles, triangles évidés). Lumière et matière, adaptation au climat tropical, symbole politique.", koTip: "루이스 칸 · 물 위의 기념비적 콘크리트 매스, 원·삼각형 개구부.", img: "images/21.jpg" },
      { id: 22, chapter: "#3 Régionalisme critique", name: "FAU-USP", architect: "João Batista Vilanova Artigas", location: "São Paulo, Brésil", year: "1972 (슬라이드; projet 1961–69)", desc: "École d'architecture : grand espace libre central sous un toit en béton, rampes. Architecture sociale, modernité critique.", koTip: "⚠ 슬라이드에 'argentin' 오타가 있지만 Artigas는 브라질(brésilien) 건축가! 거대 콘크리트 지붕 아래 열린 학교.", img: "images/22.jpg" },
      { id: 23, chapter: "#4 Modernités tropicales", name: "Gandhi Smarak Sangrahalaya", architect: "Charles Correa", location: "Ahmedabad (ashram Sabarmati), Inde", year: "1963", desc: "Musée pavillonnaire, modules carrés ouverts et fragmentés autour d'un bassin. Ventilation naturelle, brique et tuiles locales : architecture climatique exemplaire.", koTip: "분절된 정사각형 파빌리온 + 수공간 + 자연 환기 (박물관).", img: "images/23.jpg" },
      { id: 24, chapter: "#4 Modernités tropicales", name: "MASP", architect: "Lina Bo Bardi", location: "São Paulo, Avenida Paulista", year: "1968", desc: "Musée suspendu entre deux portiques rouges, grande portée. Le rez-de-chaussée reste un espace public libre : architecture sociale, icône brésilienne.", koTip: "빨간 포르티코(기둥) 2개에 매달린 미술관 · 1층을 완전한 공공 광장으로 비움.", img: "images/24.jpg" },
      { id: 25, chapter: "#4 Modernités tropicales", name: "IIM Bangalore", architect: "Balkrishna Doshi", location: "Bangalore, Inde", year: "1983", desc: "Campus structuré par des cours et des circulations ombragées (pergolas). Adaptation au climat tropical, référence aux villes traditionnelles : architecture comme système.", koTip: "중정과 그늘진 동선(퍼골라)으로 엮인 캠퍼스 · 전통 도시 구조 참조.", img: "images/25.jpg" },
      { id: 26, chapter: "#4 Modernités tropicales", name: "Kandalama Hotel", architect: "Geoffrey Bawa", location: "Dambulla, Sri Lanka", year: "1983 (슬라이드; ouvert 1994)", desc: "Hôtel intégré dans la jungle et la falaise, couvert de végétation. Fusion architecture / paysage, ventilation naturelle : archétype du tropical modernism.", koTip: "절벽과 정글에 스며든 호텔 · 식생 피복 + 자연 환기.", img: "images/26.jpg" },
      { id: 27, chapter: "#5 Métabolisme japonais", name: "Sky House", architect: "Kiyonori Kikutake", location: "Tokyo", year: "1958", desc: "Plateforme libre surélevée sur quatre voiles ; les espaces servis (« move-nets ») s'ajoutent au fil du temps. Prototype domestique du métabolisme.", koTip: "4개 벽체 위에 들어 올린 주거 + 교체 가능한 'move-nets'.", img: "images/27.jpg" },
      { id: 28, chapter: "#5 Métabolisme japonais", name: "Yamanashi Broadcasting Center", architect: "Kenzo Tange", location: "Kofu, Japon", year: "1967", desc: "Bâtiment organisé autour de noyaux verticaux (cylindres) ; plateaux pouvant être prolongés. Idée de structure-support.", koTip: "원통형 수직 코어들 사이에 바닥판을 끼워 확장 가능하게 만든 구조.", img: "images/28.jpg" },
      { id: 29, chapter: "#7 Néo-capitales", name: "Brasília", architect: "Lúcio Costa (Plano Piloto) & Oscar Niemeyer (bâtiments)", location: "Brésil (plateau central)", year: "1960", desc: "Ville planifiée ex nihilo, axe monumental + axes résidentiels (forme d'avion/croix). Zoning fonctionnel, projet politique national, icône du modernisme mondial.", koTip: "백지 위 계획 수도 (비행기/십자 형태 Plano Piloto) · Costa(도시계획) + Niemeyer(건물).", img: "images/29.jpg" },
      { id: 30, chapter: "#7 Néo-capitales", name: "Chandigarh (Capitol Complex)", architect: "Le Corbusier (avec Pierre Jeanneret)", location: "Chandigarh, Pendjab, Inde", year: "1963 (Capitol, slide) ; 1965", desc: "Capitale du Pendjab après la Partition. Architecture monumentale en béton, modernisme exporté : symbole d'un État postcolonial (Nehru).", koTip: "인도 분리독립 후 펀자브 주도 · 네루의 탈식민 국가 상징 · 노출 콘크리트 기념비성.", img: "images/30.jpg" }
    ];

    const CONFUSING_PAIRS = [
      { title: "1. Ricardo Bofill 2개", body: "Walden 7 (1975, 바르셀로나 근교, 미로형 붉은 집합주택) vs Espaces d'Abraxas (1983, 파리 근교 Noisy-le-Grand, 고전 기둥 모양 거대 주거)" },
      { title: "2. Charles Correa 2개", body: "Gandhi Smarak Sangrahalaya (1963, 아메다바드, 열린 정사각형 파빌리온 박물관) vs Kanchanjunga Apartments (1983, 뭄바이 타워, 2층 높이 테라스)" },
      { title: "3. São Paulo 2개", body: "MASP (1968, Lina Bo Bardi, 빨간 기둥에 매단 미술관) vs FAU-USP (1972 slide, Artigas, 거대 콘크리트 지붕 아래 열린 건축학교)" },
      { title: "4. 일본 메타볼리즘 3인방", body: "원통 코어 = Kenzo Tange (Yamanashi, 1967) · 캡슐 = Kisho Kurokawa (Nakagin, 1972) · 들어 올린 집 = Kiyonori Kikutake (Sky House, 1958)" },
      { title: "5. 국회 의사당 2개", body: "Koweït = Jørn Utzon (1972 slide, 텐트·수크 같은 큰 지붕) vs Bangladesh = Louis Kahn (1982, 원·삼각형으로 뚫린 벽, 물 위)" },
      { title: "6. 영국 집합주택 2개", body: "하늘 길(streets in the sky) = Alison & Peter Smithson (Robin Hood Gardens, 1972) vs 주민 참여 + 긴 벽 = Ralph Erskine (Byker Wall, 1982)" }
    ];

    const CHAPTERS = ["ALL", ...new Set(PROJECTS.map(p => p.chapter))];
    const STORAGE_KEY = "atelier42_histoire_30_v1";

    let progress = loadProgress();
    let state = {
      mode: "flashcard",
      chapter: "ALL",
      onlyWeak: false,
      quizType: "random",
      pool: [],
      index: 0,
      answered: false,
      selectedOption: null,
      photoRevealed: false,
      flashFlipped: false,
      flashHint: false,
      flashFront: "photo", // 'photo' | 'name'
      examSet: [],
      examRevealed: {},
      searchQuery: ""
    };

    function loadProgress() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); } catch { return {}; }
    }
    function saveProgress() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); } catch {}
    }
    function getStatus(id) { return progress[id] || "new"; }
    function setStatus(id, st) {
      progress[id] = st;
      saveProgress();
      renderStats();
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getFiltered() {
      return PROJECTS.filter(p => {
        if (state.chapter !== "ALL" && p.chapter !== state.chapter) return false;
        if (state.onlyWeak && getStatus(p.id) === "mastered") return false;
        return true;
      });
    }

    function rebuildPool() {
      state.pool = shuffle(getFiltered());
      state.index = 0;
      state.answered = false;
      state.selectedOption = null;
      state.photoRevealed = false;
      state.flashFlipped = false;
    }

    function googleImgUrl(p) {
      return `https://www.google.com/search?tbm=isch&q=${encodeURIComponent(p.name + " " + p.architect)}`;
    }

    function openZoom(src) {
      document.getElementById("lightboxImg").src = src;
      document.getElementById("lightbox").classList.add("open");
    }

    function renderMediaPane(p, hideTitle = false) {
      if (p.img) {
        return `
          <div class="media-pane">
            <img src="${p.img}" alt="${hideTitle ? "Architecture project" : p.name}" onclick="openZoom('${p.img}')">
          </div>
        `;
      }
      return `
        <div class="media-pane">
          <div class="media-fallback">
            <div>대표 사진 없음 (${p.name})</div>
            <a href="${googleImgUrl(p)}" target="_blank" rel="noopener">구글 이미지 보기 ↗</a>
          </div>
        </div>
      `;
    }

    function renderStats() {
      const mastered = PROJECTS.filter(p => getStatus(p.id) === "mastered").length;
      const review = PROJECTS.filter(p => getStatus(p.id) === "review").length;
      document.getElementById("statMastered").textContent = `암기 ${mastered}/30`;
      document.getElementById("statReview").textContent = `복습 ${review}`;
      document.getElementById("progressFill").style.width = `${Math.round((mastered / 30) * 100)}%`;
    }

    function renderFilters() {
      const bar = document.getElementById("filtersBar");
      const lockViewport = ["photo", "flashcard", "quiz"].includes(state.mode);
      document.body.classList.toggle("viewport-fit", lockViewport);

      if (state.mode === "pairs") {
        bar.innerHTML = "";
        return;
      }

      let html = `
        <select id="chapterSelect" aria-label="단원 필터">
          ${CHAPTERS.map(c => `<option value="${c}" ${state.chapter === c ? "selected" : ""}>${c === "ALL" ? "전체 (30)" : c}</option>`).join("")}
        </select>
        <label class="check-pill">
          <input type="checkbox" id="weakCheck" ${state.onlyWeak ? "checked" : ""}>
          미암기만
        </label>
      `;

      if (state.mode === "quiz") {
        html += `
          <select id="quizTypeSelect" aria-label="출제 유형">
            <option value="random" ${state.quizType === "random" ? "selected" : ""}>랜덤 (건축가·건물명·연도)</option>
            <option value="architect" ${state.quizType === "architect" ? "selected" : ""}>건축가</option>
            <option value="name" ${state.quizType === "name" ? "selected" : ""}>건물명</option>
            <option value="year" ${state.quizType === "year" ? "selected" : ""}>연도</option>
            <option value="location" ${state.quizType === "location" ? "selected" : ""}>장소</option>
          </select>
        `;
      }

      if (state.mode === "flashcard") {
        html += `
          <select id="flashFrontSelect" aria-label="앞면 표시">
            <option value="photo" ${state.flashFront === "photo" ? "selected" : ""}>앞면: 사진</option>
            <option value="name" ${state.flashFront === "name" ? "selected" : ""}>앞면: 건물명</option>
          </select>
        `;
      }

      if (["photo", "flashcard", "quiz"].includes(state.mode)) {
        html += `<button class="btn" id="shuffleBtn">섞기</button>`;
      } else if (state.mode === "exam") {
        html += `<button class="btn primary" id="newExamBtn">새로 3개 뽑기</button>`;
      } else if (state.mode === "list") {
        html += `
          <input type="text" id="searchInput" placeholder="검색..." value="${state.searchQuery}">
          <button class="btn" id="resetBtn">초기화</button>
        `;
      }

      bar.innerHTML = html;

      document.getElementById("chapterSelect")?.addEventListener("change", e => {
        state.chapter = e.target.value;
        rebuildPool();
        renderMain();
      });
      document.getElementById("weakCheck")?.addEventListener("change", e => {
        state.onlyWeak = e.target.checked;
        rebuildPool();
        renderMain();
      });
      document.getElementById("flashFrontSelect")?.addEventListener("change", e => {
        state.flashFront = e.target.value;
        state.flashFlipped = false;
        renderMain();
      });
      document.getElementById("quizTypeSelect")?.addEventListener("change", e => {
        state.quizType = e.target.value;
        state.answered = false;
        state.selectedOption = null;
        renderMain();
      });
      document.getElementById("shuffleBtn")?.addEventListener("click", () => {
        rebuildPool();
        renderMain();
      });
      document.getElementById("newExamBtn")?.addEventListener("click", () => {
        const src = getFiltered();
        state.examSet = shuffle(src.length >= 3 ? src : PROJECTS).slice(0, 3);
        state.examRevealed = {};
        renderMain();
      });
      document.getElementById("searchInput")?.addEventListener("input", e => {
        state.searchQuery = e.target.value;
        renderMain();
      });
      document.getElementById("resetBtn")?.addEventListener("click", () => {
        if (confirm("암기 상태를 초기화할까요?")) {
          progress = {};
          saveProgress();
          render();
        }
      });
    }

    function renderAnswerBlock(p) {
      return `
        <div class="answer-box">
          <div class="meta-grid">
            <div class="meta-item"><div class="meta-label">Projet</div><div class="meta-val">${p.name}</div></div>
            <div class="meta-item"><div class="meta-label">Architecte</div><div class="meta-val">${p.architect}</div></div>
            <div class="meta-item"><div class="meta-label">Lieu</div><div class="meta-val">${p.location}</div></div>
            <div class="meta-item"><div class="meta-label">Date (Slide)</div><div class="meta-val">${p.year}</div></div>
          </div>
          <div class="desc-fr">${p.desc}</div>
          ${p.koTip ? `<div class="ko-tip">${p.koTip}</div>` : ""}
        </div>
      `;
    }

    function renderPhotoQuiz(main) {
      if (state.pool.length === 0) rebuildPool();
      if (state.pool.length === 0) {
        main.innerHTML = `<div class="split-card no-media"><p>조건에 맞는 프로젝트가 없습니다.</p></div>`;
        return;
      }
      const idx = state.index % state.pool.length;
      const p = state.pool[idx];

      main.innerHTML = `
        <div class="split-card">
          ${renderMediaPane(p, !state.photoRevealed)}
          <div class="content-pane">
            <div class="content-scroll">
              <div class="card-top">
                <span class="chapter-badge">${state.photoRevealed ? p.chapter : "사진 보고 맞히기"}</span>
                <span class="counter">${idx + 1} / ${state.pool.length}</span>
              </div>

              ${!state.photoRevealed ? `
                <p class="sub-hint">건물명 · 건축가 · 연도를 떠올린 뒤 확인하세요. (사진 클릭 시 확대)</p>
                <div class="field-stack">
                  <div class="field-row"><label>Projet (건물명)</label><input type="text" placeholder="예: Habitat 67"></div>
                  <div class="field-row"><label>Architecte (건축가)</label><input type="text" placeholder="예: Moshe Safdie"></div>
                  <div class="field-row"><label>Date (연도)</label><input type="text" placeholder="예: 1967"></div>
                </div>
                <button class="btn primary" id="revealPhotoBtn" style="width:100%;">정답 확인 (Space)</button>
              ` : renderAnswerBlock(p)}
            </div>

            <div>
              <div class="card-actions">
                <div style="display:flex;gap:6px;">
                  <button class="btn ${getStatus(p.id) === "mastered" ? "ok" : ""}" id="pOk">암기 (1)</button>
                  <button class="btn ${getStatus(p.id) === "review" ? "bad" : ""}" id="pBad">복습 (2)</button>
                </div>
                <div style="display:flex;gap:6px;">
                  <button class="btn" id="pPrev">←</button>
                  <button class="btn primary" id="pNext">다음 →</button>
                </div>
              </div>
              <div class="kbd-hint">Space 정답 · 1 암기 · 2 복습 · ←/→ 이동</div>
            </div>
          </div>
        </div>
      `;

      document.getElementById("revealPhotoBtn")?.addEventListener("click", () => {
        state.photoRevealed = true;
        renderMain();
      });
      document.getElementById("pOk")?.addEventListener("click", () => {
        setStatus(p.id, "mastered");
        state.index = (state.index + 1) % state.pool.length;
        state.photoRevealed = false;
        renderMain();
      });
      document.getElementById("pBad")?.addEventListener("click", () => {
        setStatus(p.id, "review");
        state.index = (state.index + 1) % state.pool.length;
        state.photoRevealed = false;
        renderMain();
      });
      document.getElementById("pPrev")?.addEventListener("click", () => {
        state.index = (state.index - 1 + state.pool.length) % state.pool.length;
        state.photoRevealed = false;
        renderMain();
      });
      document.getElementById("pNext")?.addEventListener("click", () => {
        state.index = (state.index + 1) % state.pool.length;
        state.photoRevealed = false;
        renderMain();
      });
    }

    function renderFlashcard(main) {
      if (state.pool.length === 0) rebuildPool();
      if (state.pool.length === 0) {
        main.innerHTML = `<div class="split-card no-media"><p>조건에 맞는 프로젝트가 없습니다.</p></div>`;
        return;
      }
      const idx = state.index % state.pool.length;
      const p = state.pool[idx];

      let stageHtml = "";
      if (!state.flashFlipped) {
        if (state.flashFront === "photo") {
          stageHtml = `
            <div class="quizlet-front-photo">
              <img src="${p.img}" alt="Architecture project">
              <span class="quizlet-tap-hint">클릭 또는 Space → 연도 · 건축가 · 건물이름 보기</span>
            </div>
          `;
        } else {
          stageHtml = `
            <div style="padding:32px;text-align:center;">
              <h2 class="project-title" style="font-size:clamp(24px,3.2vw,34px);margin-bottom:8px;">${p.name}</h2>
              <p class="sub-hint" style="margin:0;">클릭 또는 Space → 사진 · 건축가 · 연도 · 설명 보기</p>
            </div>
          `;
        }
      } else {
        stageHtml = `
          <div class="quizlet-back">
            <div class="quizlet-back-head">
              <div class="quizlet-back-year">${p.year} · ${p.location}</div>
              <h2 class="quizlet-back-name">${p.name}</h2>
              <div class="quizlet-back-arch">${p.architect}</div>
            </div>
            <div class="desc-fr">${p.desc}</div>
            ${p.koTip ? `<div class="ko-tip">${p.koTip}</div>` : ""}
            <div style="font-size:12px;color:var(--muted);">다시 클릭하면 앞면으로 돌아갑니다</div>
          </div>
        `;
      }

      main.innerHTML = `
        <div class="quizlet-card">
          <div class="card-top">
            <span class="chapter-badge">${state.flashFlipped || state.flashHint ? p.chapter : "Quizlet 플래시카드"}</span>
            <div style="display:flex;align-items:center;gap:8px;">
              ${!state.flashFlipped ? `<button class="btn" id="hintBtn" style="min-height:28px;padding:3px 10px;font-size:12px;">${state.flashHint ? "단원 숨김" : "단원 힌트"}</button>` : ""}
              <span class="counter">${idx + 1} / ${state.pool.length}</span>
            </div>
          </div>

          <div class="quizlet-stage" id="quizletStage" role="button" tabindex="0" aria-label="카드 뒤집기">
            ${stageHtml}
          </div>

          <div>
            <div class="card-actions">
              <div style="display:flex;gap:6px;">
                <button class="btn ${getStatus(p.id) === "mastered" ? "ok" : ""}" id="fcOk">암기 (1)</button>
                <button class="btn ${getStatus(p.id) === "review" ? "bad" : ""}" id="fcBad">복습 (2)</button>
              </div>
              <div style="display:flex;gap:6px;">
                <button class="btn" id="fcPrev">←</button>
                <button class="btn primary" id="fcNext">다음 →</button>
              </div>
            </div>
            <div class="kbd-hint">카드 클릭 또는 Space 뒤집기 · 1 암기 · 2 복습 · ←/→ 이동</div>
          </div>
        </div>
      `;

      document.getElementById("quizletStage")?.addEventListener("click", () => { state.flashFlipped = !state.flashFlipped; renderMain(); });
      document.getElementById("hintBtn")?.addEventListener("click", e => { e.stopPropagation(); state.flashHint = !state.flashHint; renderMain(); });
      document.getElementById("fcOk")?.addEventListener("click", () => { setStatus(p.id, "mastered"); state.index = (state.index + 1) % state.pool.length; state.flashFlipped = false; renderMain(); });
      document.getElementById("fcBad")?.addEventListener("click", () => { setStatus(p.id, "review"); state.index = (state.index + 1) % state.pool.length; state.flashFlipped = false; renderMain(); });
      document.getElementById("fcPrev")?.addEventListener("click", () => { state.index = (state.index - 1 + state.pool.length) % state.pool.length; state.flashFlipped = false; renderMain(); });
      document.getElementById("fcNext")?.addEventListener("click", () => { state.index = (state.index + 1) % state.pool.length; state.flashFlipped = false; renderMain(); });
    }

    let cachedKey = "", cachedQ = null;
    function buildQuestion(p, type) {
      const resolvedType = type === "random"
        ? ["architect", "name", "year"][Math.floor(Math.random() * 3)]
        : type;
      const others = shuffle(PROJECTS.filter(x => x.id !== p.id));
      let title = "", sub = "", correct = "", opts = [];
      if (resolvedType === "architect") {
        title = p.name; sub = `${p.location} · 건축가는?`; correct = p.architect;
        const picks = [];
        for (const o of others) if (o.architect !== correct && !picks.includes(o.architect)) { picks.push(o.architect); if (picks.length === 3) break; }
        opts = shuffle([correct, ...picks]);
      } else if (resolvedType === "name") {
        title = `${p.architect} (${p.year})`; sub = p.desc; correct = p.name;
        opts = shuffle([correct, ...others.slice(0, 3).map(o => o.name)]);
      } else if (resolvedType === "year") {
        title = p.name; sub = `${p.architect} · 슬라이드 기준 연도는?`; correct = p.year;
        const picks = [];
        for (const o of others) if (o.year !== correct && !picks.includes(o.year)) { picks.push(o.year); if (picks.length === 3) break; }
        opts = shuffle([correct, ...picks]);
      } else {
        title = p.name; sub = `${p.architect} · 장소는?`; correct = p.location;
        const picks = [];
        for (const o of others) if (o.location !== correct && !picks.includes(o.location)) { picks.push(o.location); if (picks.length === 3) break; }
        opts = shuffle([correct, ...picks]);
      }
      return { title, sub, correct, opts, resolvedType };
    }

    function renderQuiz(main) {
      if (state.pool.length === 0) rebuildPool();
      if (state.pool.length === 0) {
        main.innerHTML = `<div class="split-card no-media"><p>조건에 맞는 프로젝트가 없습니다.</p></div>`;
        return;
      }
      const idx = state.index % state.pool.length;
      const p = state.pool[idx];
      const key = `${p.id}-${state.quizType}-${idx}`;
      if (cachedKey !== key) { cachedKey = key; cachedQ = buildQuestion(p, state.quizType); }
      const q = cachedQ;

      main.innerHTML = `
        <div class="split-card">
          ${renderMediaPane(p, q.resolvedType === "name" && !state.answered)}
          <div class="content-pane">
            <div class="content-scroll">
              <div class="card-top">
                <span class="chapter-badge">${p.chapter}</span>
                <span class="counter">${idx + 1} / ${state.pool.length}</span>
              </div>
              <h2 class="project-title">${q.title}</h2>
              <p class="sub-hint">${q.sub}</p>
              <div class="options-grid">
                ${q.opts.map((opt, i) => {
                  let cls = "option-btn";
                  if (state.answered) {
                    if (opt === q.correct) cls += " correct";
                    else if (opt === state.selectedOption) cls += " wrong";
                  }
                  return `<button class="${cls}" data-opt="${i}" ${state.answered ? "disabled" : ""}><span class="option-key">${i + 1}</span><span>${opt}</span></button>`;
                }).join("")}
              </div>
              ${state.answered ? `<div style="margin-top:10px;">${renderAnswerBlock(p)}</div>` : ""}
            </div>
            <div>
              <div class="card-actions">
                <div style="display:flex;gap:6px;">
                  <button class="btn ${getStatus(p.id) === "mastered" ? "ok" : ""}" id="qOk">암기</button>
                  <button class="btn ${getStatus(p.id) === "review" ? "bad" : ""}" id="qBad">복습</button>
                </div>
                <div style="display:flex;gap:6px;">
                  <button class="btn" id="qPrev">←</button>
                  <button class="btn primary" id="qNext">다음 →</button>
                </div>
              </div>
              <div class="kbd-hint">1–4 보기 선택 · Enter / → 다음</div>
            </div>
          </div>
        </div>
      `;

      main.querySelectorAll("[data-opt]").forEach(btn => {
        btn.addEventListener("click", () => {
          if (state.answered) return;
          const chosen = q.opts[Number(btn.dataset.opt)];
          state.selectedOption = chosen;
          state.answered = true;
          if (chosen === q.correct) { if (getStatus(p.id) === "new") setStatus(p.id, "mastered"); }
          else setStatus(p.id, "review");
          renderMain();
        });
      });
      document.getElementById("qOk")?.addEventListener("click", () => { setStatus(p.id, "mastered"); renderMain(); });
      document.getElementById("qBad")?.addEventListener("click", () => { setStatus(p.id, "review"); renderMain(); });
      document.getElementById("qPrev")?.addEventListener("click", () => { state.index = (state.index - 1 + state.pool.length) % state.pool.length; state.answered = false; state.selectedOption = null; renderMain(); });
      document.getElementById("qNext")?.addEventListener("click", () => { state.index = (state.index + 1) % state.pool.length; state.answered = false; state.selectedOption = null; renderMain(); });
    }

    function renderExam(main) {
      if (state.examSet.length === 0) {
        const src = getFiltered();
        state.examSet = shuffle(src.length >= 3 ? src : PROJECTS).slice(0, 3);
      }
      main.innerHTML = `
        <div class="grid-list">
          ${state.examSet.map((p, idx) => {
            const rev = !!state.examRevealed[p.id];
            return `
              <div class="exam-card">
                <div class="card-top">
                  <span class="chapter-badge">시험 1번 · 문제 ${idx + 1}/3</span>
                  <span class="counter">${rev ? p.chapter : ""}</span>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start;">
                  ${renderMediaPane(p, !rev)}
                  <div>
                    <h2 class="project-title">${p.name}</h2>
                    <div class="field-stack">
                      <div class="field-row"><label>Architecte</label><input type="text" placeholder="건축가"></div>
                      <div class="field-row"><label>Lieu</label><input type="text" placeholder="장소"></div>
                      <div class="field-row"><label>Date</label><input type="text" placeholder="연도"></div>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                      <button class="btn primary" data-rev="${p.id}">${rev ? "정답 접기" : "정답 확인"}</button>
                      ${rev ? `
                        <button class="btn ${getStatus(p.id) === "mastered" ? "ok" : ""}" data-ex-ok="${p.id}">암기</button>
                        <button class="btn ${getStatus(p.id) === "review" ? "bad" : ""}" data-ex-bad="${p.id}">복습</button>
                      ` : ""}
                    </div>
                  </div>
                </div>
                ${rev ? `<div style="margin-top:12px;">${renderAnswerBlock(p)}</div>` : ""}
              </div>
            `;
          }).join("")}
        </div>
      `;
      main.querySelectorAll("[data-rev]").forEach(b => b.addEventListener("click", () => { const id = Number(b.dataset.rev); state.examRevealed[id] = !state.examRevealed[id]; renderMain(); }));
      main.querySelectorAll("[data-ex-ok]").forEach(b => b.addEventListener("click", () => { setStatus(Number(b.dataset.exOk), "mastered"); renderMain(); }));
      main.querySelectorAll("[data-ex-bad]").forEach(b => b.addEventListener("click", () => { setStatus(Number(b.dataset.exBad), "review"); renderMain(); }));
    }

    function renderPairs(main) {
      main.innerHTML = `<div class="pairs-grid">${CONFUSING_PAIRS.map(x => `<div class="pair-card"><h3>${x.title}</h3><p>${x.body}</p></div>`).join("")}</div>`;
    }

    function renderList(main) {
      const q = state.searchQuery.trim().toLowerCase();
      const items = getFiltered().filter(p => !q || (p.name + p.architect + p.location + p.year + p.desc).toLowerCase().includes(q));
      main.innerHTML = `
        <div class="grid-list">
          ${items.map(p => {
            const st = getStatus(p.id);
            return `
              <div class="list-row">
                <div class="list-thumb">
                  ${p.img ? `<img src="${p.img}" alt="${p.name}" loading="lazy" onclick="openZoom('${p.img}')">` : `<a href="${googleImgUrl(p)}" target="_blank" rel="noopener">구글 이미지 ↗</a>`}
                </div>
                <div>
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                    <div><span class="chapter-badge" style="margin-right:6px;">${p.chapter}</span><strong>${p.id}. ${p.name}</strong></div>
                    <select data-st-id="${p.id}" style="min-height:30px;padding:3px 10px;border-radius:980px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;">
                      <option value="new" ${st === "new" ? "selected" : ""}>미학습</option>
                      <option value="review" ${st === "review" ? "selected" : ""}>복습</option>
                      <option value="mastered" ${st === "mastered" ? "selected" : ""}>암기</option>
                    </select>
                  </div>
                  <div style="font-size:13.5px;color:var(--muted);margin:4px 0;"><strong>${p.architect}</strong> · ${p.location} · <strong>${p.year}</strong></div>
                  <div style="font-size:13.5px;">${p.desc}</div>
                  ${p.koTip ? `<div style="font-size:12.5px;color:var(--muted);margin-top:4px;">↳ ${p.koTip}</div>` : ""}
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
      main.querySelectorAll("[data-st-id]").forEach(sel => sel.addEventListener("change", e => setStatus(Number(sel.dataset.stId), e.target.value)));
    }

    function renderMain() {
      const main = document.getElementById("mainView");
      if (state.mode === "photo") renderPhotoQuiz(main);
      else if (state.mode === "flashcard") renderFlashcard(main);
      else if (state.mode === "quiz") renderQuiz(main);
      else if (state.mode === "exam") renderExam(main);
      else if (state.mode === "pairs") renderPairs(main);
      else renderList(main);
    }

    function render() {
      renderStats();
      renderFilters();
      renderMain();
    }

    document.querySelectorAll("#modeTabs .pill-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#modeTabs .pill-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.mode = btn.dataset.mode;
        rebuildPool();
        render();
      });
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") document.getElementById("lightbox").classList.remove("open");
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;
      if (state.mode === "photo") {
        if (e.code === "Space") { e.preventDefault(); document.getElementById("revealPhotoBtn")?.click(); }
        else if (e.key === "1") document.getElementById("pOk")?.click();
        else if (e.key === "2") document.getElementById("pBad")?.click();
        else if (e.key === "ArrowRight") document.getElementById("pNext")?.click();
        else if (e.key === "ArrowLeft") document.getElementById("pPrev")?.click();
      } else if (state.mode === "flashcard") {
        if (e.code === "Space") { e.preventDefault(); document.getElementById("quizletStage")?.click(); }
        else if (e.key === "1") document.getElementById("fcOk")?.click();
        else if (e.key === "2") document.getElementById("fcBad")?.click();
        else if (e.key === "ArrowRight") document.getElementById("fcNext")?.click();
        else if (e.key === "ArrowLeft") document.getElementById("fcPrev")?.click();
      } else if (state.mode === "quiz") {
        if (["1", "2", "3", "4"].includes(e.key) && !state.answered) document.querySelector(`[data-opt="${Number(e.key) - 1}"]`)?.click();
        else if (e.key === "Enter" || e.key === "ArrowRight") document.getElementById("qNext")?.click();
        else if (e.key === "ArrowLeft") document.getElementById("qPrev")?.click();
      }
    });

    rebuildPool();
    render();
  </script>
</body>
</html>
