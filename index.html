<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <title>Quiz — 4·2</title>
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="brand.css?v=20261118q2">
  <link rel="stylesheet" href="fonts.css?v=20261118f1">

  <style>
    :root {
      color-scheme: light;
      --ink: #1d1d1f;
      --muted: #6e6e73;
      --accent: #e6b89c;
      --paper: #ffffff;
      --background: #ffffff;
      --surface: #f5f5f7;
      --line: #d2d2d7;
      --nav: rgb(255 255 255 / 86%);
      --on-primary: #ffffff;
      --ok: #15803d;
      --ok-bg: #dcfce7;
      --bad: #b91c1c;
      --bad-bg: #fee2e2;
      --warn: #b45309;
      --warn-bg: #fef3c7;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --ink: #f5f5f7;
        --muted: #a1a1a6;
        --accent: #e6b89c;
        --paper: #000000;
        --background: #000000;
        --surface: #1d1d1f;
        --line: #48484a;
        --nav: rgb(0 0 0 / 86%);
        --on-primary: #1d1d1f;
        --ok: #4ade80;
        --ok-bg: rgb(21 128 61 / 22%);
        --bad: #f87171;
        --bad-bg: rgb(185 28 28 / 22%);
        --warn: #fbbf24;
        --warn-bg: rgb(180 83 9 / 22%);
      }
      #brand-home .brand-mark,
      #brand-home .brand-tool { color: #f5f5f7; }
    }

    * { box-sizing: border-box; }
    button, input, select, textarea { font: inherit; color: inherit; }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--ink);
      font: 15px/1.55 "Pretendard Variable", "Pretendard", -apple-system,
        BlinkMacSystemFont, system-ui, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* Single-viewport layout on desktop */
    @media (min-width: 860px) {
      body.viewport-fit {
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      body.viewport-fit .workspace {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding-bottom: 16px;
      }
      body.viewport-fit #mainView {
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      body.viewport-fit .split-card {
        flex: 1;
        min-height: 0;
      }
    }

    .page-header {
      flex: none;
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--nav);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border-bottom: 1px solid var(--line);
    }

    .nav-inner {
      max-width: 1160px;
      margin: 0 auto;
      padding: 6px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    #brand-home { text-decoration: none; }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .deck-bar {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .deck-select {
      min-height: 32px;
      max-width: 220px;
      padding: 3px 10px;
      border-radius: 980px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 980px;
      font-size: 12px;
      font-weight: 600;
      background: var(--surface);
      border: 1px solid var(--line);
      white-space: nowrap;
    }
    .stat-pill.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
    .stat-pill.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }

    .progress-thin {
      height: 2px;
      width: 100%;
      background: var(--surface);
    }
    .progress-thin-fill {
      height: 100%;
      background: var(--ink);
      transition: width 250ms ease;
    }

    .workspace {
      width: min(1160px, calc(100% - 32px));
      margin: 0 auto;
      padding: 14px 0 40px;
    }

    .toolbar {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .mode-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    button.pill-btn {
      appearance: none;
      min-height: 36px;
      padding: 6px 14px;
      border-radius: 980px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 140ms ease;
    }
    button.pill-btn:hover { border-color: var(--ink); color: var(--ink); }
    button.pill-btn.active {
      background: var(--ink);
      color: var(--on-primary);
      border-color: var(--ink);
    }

    .filters {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filters select,
    .filters input[type="text"] {
      min-height: 36px;
      padding: 4px 10px;
      border-radius: 980px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 13px;
    }

    .check-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 36px;
      padding: 4px 12px;
      border-radius: 980px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .btn {
      appearance: none;
      min-height: 38px;
      padding: 7px 14px;
      border-radius: 980px;
      border: 1px solid var(--line);
      background: var(--paper);
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 140ms ease, border-color 140ms ease;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }
    .btn:hover:not(:disabled) { background: var(--surface); border-color: var(--ink); }
    .btn.primary { background: var(--ink); color: var(--on-primary); border-color: var(--ink); }
    .btn.primary:hover:not(:disabled) { opacity: 0.88; background: var(--ink); }
    .btn.ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
    .btn.bad { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
    .btn.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
    .btn.sm { min-height: 32px; padding: 4px 11px; font-size: 12px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }

    .srs-btn {
      flex-direction: column;
      gap: 1px;
      padding: 5px 12px;
      min-height: 42px;
      line-height: 1.2;
    }
    .srs-btn small {
      font-size: 10.5px;
      font-weight: 500;
      opacity: 0.78;
    }

    /* Quizlet-style clickable card */
    .quizlet-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      min-height: 0;
      max-width: 860px;
      width: 100%;
      margin: 0 auto;
    }

    .quizlet-stage {
      flex: 1;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border-radius: 12px;
      border: 1px solid var(--line);
      background: var(--surface);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: border-color 150ms ease, transform 120ms ease;
    }

    .quizlet-stage:hover { border-color: var(--ink); }
    .quizlet-stage:active { transform: scale(0.995); }

    .quizlet-front-photo {
      width: 100%;
      height: 100%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      padding: 8px;
    }

    .quizlet-front-photo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .quizlet-tap-hint {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      padding: 6px 14px;
      border-radius: 980px;
      background: rgba(0, 0, 0, 0.72);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      pointer-events: none;
      backdrop-filter: blur(8px);
      white-space: nowrap;
    }

    .quizlet-back {
      padding: 24px;
      background: var(--paper);
      height: 100%;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
    }

    .quizlet-back-head { display: grid; gap: 4px; }
    .quizlet-back-year {
      font-family: "Instrument Sans", sans-serif;
      font-size: 14px;
      font-weight: 600;
      color: var(--muted);
    }
    .quizlet-back-name {
      margin: 0;
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    .quizlet-back-arch {
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
    }

    /* 2-Column Single-Viewport Card */
    .split-card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      display: grid;
      grid-template-columns: 1.18fr 1fr;
      gap: 20px;
      overflow: hidden;
    }

    .split-card.no-media {
      grid-template-columns: 1fr;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
    }

    .media-pane {
      position: relative;
      min-height: 260px;
      height: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .media-pane img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      cursor: zoom-in;
    }

    .exam-card .media-pane {
      height: 300px;
    }

    .media-fallback {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }
    .media-fallback a {
      display: inline-block;
      margin-top: 8px;
      color: var(--ink);
      font-weight: 600;
    }

    .content-pane {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
      gap: 12px;
    }

    .content-scroll {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-right: 4px;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .chapter-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 980px;
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      font-weight: 600;
    }

    .counter {
      font-family: "Instrument Sans", sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
    }

    .project-title {
      margin: 0 0 6px;
      font-size: clamp(20px, 2.4vw, 26px);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    .sub-hint {
      margin: 0 0 12px;
      font-size: 13px;
      color: var(--muted);
    }

    .field-stack {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }

    .field-row label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 3px;
    }

    .field-row input,
    .field-row textarea,
    .field-row select {
      width: 100%;
      padding: 9px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 14px;
    }

    .options-grid {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 10px 13px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--paper);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      transition: border-color 120ms ease, background-color 120ms ease;
    }
    .option-btn:hover:not(:disabled) { border-color: var(--ink); background: var(--surface); }

    .option-btn.idk-btn {
      border-style: dashed;
      color: var(--muted);
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      margin-top: 2px;
    }
    .option-btn.idk-btn:hover:not(:disabled) {
      color: var(--ink);
      border-color: var(--ink);
      background: var(--surface);
    }

    .option-key {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--muted);
      font-family: "Instrument Sans", sans-serif;
      font-size: 12px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .option-btn.correct { border-color: var(--ok); background: var(--ok-bg); }
    .option-btn.correct .option-key { background: var(--ok); color: #fff; }
    .option-btn.wrong { border-color: var(--bad); background: var(--bad-bg); }
    .option-btn.wrong .option-key { background: var(--bad); color: #fff; }

    .answer-box {
      padding: 12px;
      border-radius: 12px;
      background: var(--surface);
      display: grid;
      gap: 8px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .meta-item {
      background: var(--paper);
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--line);
    }

    .meta-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
    }

    .meta-val {
      font-size: 13px;
      font-weight: 600;
      margin-top: 2px;
    }

    .desc-fr {
      font-size: 13.5px;
      line-height: 1.55;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--paper);
      border: 1px solid var(--line);
    }

    .ko-tip {
      font-size: 12.5px;
      color: var(--muted);
      padding: 7px 10px;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
      background: var(--paper);
    }

    .card-actions {
      flex: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .kbd-hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Scrollable list modes */
    .grid-list { display: grid; gap: 12px; }
    .pairs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 12px;
    }
    .pair-card, .exam-card, .list-row {
      padding: 16px;
      border-radius: 14px;
      border: 1px solid var(--line);
      background: var(--paper);
    }
    .pair-card h3 { margin: 0 0 6px; font-size: 15px; }
    .pair-card p { margin: 0; font-size: 13.5px; color: var(--muted); }

    .list-row {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 14px;
      align-items: start;
    }
    .list-row.no-thumb {
      grid-template-columns: 1fr;
    }
    .list-thumb {
      width: 120px;
      height: 84px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 4px;
    }
    .list-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; cursor: zoom-in; }

    /* Lightbox modal */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 10px;
      object-fit: contain;
    }

    /* Deck Manager Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0, 0, 0, 0.52);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-panel {
      width: min(680px, 100%);
      max-height: 88dvh;
      overflow-y: auto;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
      display: grid;
      gap: 14px;
    }
    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .modal-head h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .modal-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }
    .deck-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--surface);
    }

    @media (max-width: 859px) {
      .split-card {
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .media-pane {
        height: 240px;
        min-height: 220px;
      }
      .list-row { grid-template-columns: 1fr; }
      .list-thumb { width: 100%; height: 160px; }
      .stat-pill.bad { display: none; }
    }
    /* ===== Quiz home ===== */
    .home { padding: 56px 0 24px; text-align: center; word-break: keep-all; }
    .home-eyebrow { margin: 0 0 14px; font-family: "Instrument Sans", sans-serif; font-size: 13px; font-weight: 600; letter-spacing: .02em; color: var(--muted); }
    .home h1 { margin: 0 0 16px; font-size: clamp(34px, 5vw, 52px); line-height: 1.16; letter-spacing: -.03em; font-weight: 700; text-wrap: balance; }
    .home-sub { max-width: 640px; margin: 0 auto; color: var(--muted); font-size: clamp(16px, 1.8vw, 19px); line-height: 1.55; text-wrap: balance; }
    .home-deck { display: flex; justify-content: center; align-items: center; gap: 8px; flex-wrap: wrap; margin: 24px auto 0; }
    .home-deck .deck-select { max-width: 320px; min-height: 40px; font-size: 14px; }
    .home-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; max-width: 560px; margin: 20px auto 0; }
    .home-stat { padding: 14px 10px; border-radius: 14px; background: var(--surface); }
    .home-stat b { display: block; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums; }
    .home-stat span { font-size: 12px; color: var(--muted); font-weight: 600; }
    .home-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; max-width: 960px; margin: 36px auto 0; padding: 0; list-style: none; text-align: left; }
    .home-card { position: relative; display: flex; flex-direction: column; padding: 22px; border: 1px solid var(--line); border-radius: 16px; background: var(--paper); min-width: 0; }
    .home-card:hover, .home-card:focus-within { border-color: var(--ink); }
    .home-card.rec { border-color: var(--ink); }
    .home-card-num { margin: 0; font-family: "Instrument Sans", sans-serif; font-size: 13px; font-weight: 600; color: var(--muted); }
    .home-card-tag { position: absolute; top: 20px; right: 20px; padding: 2px 8px; border-radius: 980px; background: var(--ink); color: var(--on-primary); font-size: 11px; font-weight: 700; }
    .home-card h2 { margin: 10px 0 6px; font-size: 19px; line-height: 1.35; font-weight: 700; letter-spacing: -.02em; }
    .home-card p.d { flex-grow: 1; margin: 0; font-size: 14px; line-height: 1.6; color: var(--muted); }
    .home-card button { align-self: flex-start; margin-top: 14px; padding: 0; min-height: 40px; border: 0; background: none; font-size: 15px; font-weight: 700; color: var(--ink); cursor: pointer; text-align: left; }

  <script src="srs.js?v=20261118h"></script>
  <script src="decks.js?v=20261123h"></script>
  <script>
    const SRS = window.AtelierSRS;
    const { BUILTIN_DECKS, parseBulkText } = window.AtelierDecks;
    const GOOGLE_CLIENT_ID = "333501036096-o6m50cvb01b4t49kcedi4jq4a7kv42i3.apps.googleusercontent.com";
    const QUIZ_DRIVE_PROJECT = "Atelier 4·2 Quiz";

    let progress = SRS.loadAllProgress();
    let customDecks = SRS.loadCustomDecks();
    let activeDeckId = SRS.getActiveDeckId(BUILTIN_DECKS[0].id);
    let quizCloud = null, quizCloudUser = null, quizCloudProj = null, quizSyncing = false;

    function updateDriveBtnUi() {
      const b = document.getElementById("btnQuizDrive");
      if (b) b.textContent = quizCloudUser ? "Drive ●" : "Drive";
      const hb = document.getElementById("homeDriveBtn");
      if (hb) hb.textContent = quizCloudUser ? "Drive 연결됨 ●" : "Drive 로그인";
    }
    async function ensureQuizDriveProject() {
      if (!quizCloud || !quizCloudUser) return null;
      if (quizCloudProj) return quizCloudProj;
      const list = await quizCloud.listProjects();
      const found = list.find(p => p.name === QUIZ_DRIVE_PROJECT);
      quizCloudProj = found ? await quizCloud.openProject(found.id) : await quizCloud.createProject(QUIZ_DRIVE_PROJECT);
      return quizCloudProj;
    }
    function mergeDecks(localList, remoteList) {
      const byId = new Map();
      for (const d of (remoteList || [])) if (d && d.id && !d.builtin) byId.set(d.id, d);
      for (const d of (localList || [])) {
        if (!d || !d.id || d.builtin) continue;
        const prev = byId.get(d.id);
        if (!prev || (d.updatedAt || 0) >= (prev.updatedAt || 0)) byId.set(d.id, d);
      }
      return [...byId.values()];
    }
    async function syncDecksWithDrive(pushLocal) {
      if (!quizCloud || !quizCloudUser || quizSyncing) return;
      quizSyncing = true;
      try {
        const proj = await ensureQuizDriveProject();
        if (!proj) return;
        let remoteDecks = [];
        try {
          const r = await proj.readJson("files/decks.json");
          if (r && r.data && Array.isArray(r.data.decks)) remoteDecks = r.data.decks;
        } catch (e) { /* first sync: file does not exist yet */ }
        if (!pushLocal) {
          customDecks = mergeDecks(customDecks, remoteDecks);
          SRS.saveCustomDecks(customDecks);
        }
        await proj.writeJson("files/decks.json", { v: 1, updatedAt: Date.now(), decks: customDecks }, {});
        if (typeof render === "function") render();
      } catch (e) {
        console.warn("Quiz Drive sync failed:", e);
      } finally {
        quizSyncing = false;
        updateDriveBtnUi();
      }
    }
    function saveDecksAndSync() {
      SRS.saveCustomDecks(customDecks);
      if (quizCloudUser) syncDecksWithDrive(true);
    }
    async function initQuizCloud() {
      try {
        const m = await import("./atelier-cloud.js");
        quizCloud = m.createCloud({ googleClientId: GOOGLE_CLIENT_ID, rootFolderName: "Atelier 4·2 Share" });
        const ok = await quizCloud.restore();
        if (ok) {
          quizCloudUser = quizCloud.session();
          updateDriveBtnUi();
          await syncDecksWithDrive(false);
        }
      } catch (e) { /* offline or unavailable */ }
    }
    async function handleQuizDriveClick() {
      if (!quizCloud) await initQuizCloud();
      if (!quizCloud) { alert("Google Drive 연결을 준비하지 못했습니다."); return; }
      if (!quizCloudUser) {
        try {
          await quizCloud.signIn("google");
          quizCloudUser = quizCloud.session();
          updateDriveBtnUi();
          await syncDecksWithDrive(false);
          alert("Google Drive에 연결되었습니다. 내 덱이 자동으로 저장·동기화됩니다.");
        } catch (e) {
          alert("Google 로그인을 완료하지 못했습니다.");
        }
      } else {
        const choice = confirm(`Google Drive(${quizCloudUser.email || "연결됨"})와 동기화 중입니다.\n\n[확인] 지금 다시 동기화\n[취소] 로그아웃 여부 선택`);
        if (choice) {
          await syncDecksWithDrive(false);
          alert("Drive 동기화를 마쳤습니다.");
        } else if (confirm("Google Drive 연결을 해제(로그아웃)할까요? 로컬 덱은 유지됩니다.")) {
          await quizCloud.signOut();
          quizCloudUser = null; quizCloudProj = null;
          updateDriveBtnUi();
          render();
        }
      }
    }
    function resizeCardImage(file) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file), img = new Image();
        img.onload = () => {
          const max = 800, k = Math.min(1, max / img.naturalWidth, max / img.naturalHeight);
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(img.naturalWidth * k));
          c.height = Math.max(1, Math.round(img.naturalHeight * k));
          const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
          ctx.drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL("image/jpeg", 0.82));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
        img.src = url;
      });
    }
    let xlsxLoaded = null;
    function loadXlsxLib() {
      if (window.XLSX) return Promise.resolve(window.XLSX);
      if (xlsxLoaded) return xlsxLoaded;
      xlsxLoaded = new Promise((resolve, reject) => {
        const s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
        s.onload = () => resolve(window.XLSX);
        s.onerror = () => { xlsxLoaded = null; reject(new Error("xlsx-load-failed")); };
        document.head.appendChild(s);
      });
      return xlsxLoaded;
    }
    function rowsToCards(rows) {
      const clean = (rows || []).map(r => (Array.isArray(r) ? r : []).map(v => String(v == null ? "" : v).trim())).filter(r => r.some(Boolean));
      if (!clean.length) return [];
      const first = clean[0].map(h => h.toLowerCase());
      const findCol = re => first.findIndex(h => re.test(h));
      let iFront = findCol(/^(앞면|front|question|term|질문|단어|문제|표제어|word)$/);
      let iBack = findCol(/^(뒷면|back|answer|definition|정답|뜻|설명|의미|meaning)$/);
      let iTip = findCol(/^(팁|메모|힌트|tip|hint|note|memo|설명2)$/);
      let iCh = findCol(/^(단원|태그|카테고리|chapter|tag|category|deck|분류)$/);
      let iImg = findCol(/^(이미지|사진|image|img|photo|url)$/);
      const hasHeader = iFront >= 0 || iBack >= 0;
      if (iFront < 0) iFront = 0;
      if (iBack < 0) iBack = iFront === 0 ? 1 : 0;
      if (!hasHeader) { iTip = 2; iCh = 3; iImg = 4; }
      const dataRows = hasHeader ? clean.slice(1) : clean;
      const now = Date.now(), cards = [];
      dataRows.forEach((r, idx) => {
        const front = r[iFront] || "", back = r[iBack] || "";
        if (!front || !back) return;
        const img = (iImg >= 0 && r[iImg] && /^https?:\/\/|^data:image\//i.test(r[iImg])) ? r[iImg] : "";
        cards.push({
          id: `c_${now}_${idx}`,
          chapter: (iCh >= 0 && r[iCh]) ? r[iCh] : "일반",
          front, back, sub: "", desc: back,
          koTip: (iTip >= 0 && r[iTip]) ? r[iTip] : "",
          img
        });
      });
      return cards;
    }
    async function parseSpreadsheetFile(file) {
      const name = file.name || "";
      if (/\.(csv|tsv|txt)$/i.test(name)) {
        const buf = await file.arrayBuffer();
        let text = "";
        try { text = new TextDecoder("utf-8", { fatal: true }).decode(buf); }
        catch { text = new TextDecoder("euc-kr").decode(buf); }
        text = text.replace(/^\uFEFF/, "");
        if (/\.txt$/i.test(name) && !text.includes(",") && !text.includes("\t")) return parseBulkText(text);
        const sep = text.includes("\t") ? "\t" : ",";
        const rows = text.split(/\r?\n/).filter(Boolean).map(line => {
          if (sep === "\t") return line.split("\t");
          const out = []; let cur = "", inQ = false;
          for (let i = 0; i < line.length; i++) {
            const ch = line[i];
            if (ch === '"') { if (inQ && line[i + 1] === '"') { cur += '"'; i++; } else inQ = !inQ; }
            else if (ch === "," && !inQ) { out.push(cur); cur = ""; }
            else cur += ch;
          }
          out.push(cur);
          return out;
        });
        return rowsToCards(rows);
      }
      const XLSX = await loadXlsxLib();
      const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: "" });
      return rowsToCards(rows);
    }

    function getAllDecks() {
      return [...BUILTIN_DECKS, ...customDecks];
    }

    function getActiveDeck() {
      const all = getAllDecks();
      return all.find(d => d.id === activeDeckId) || all[0];
    }

    if (!getAllDecks().some(d => d.id === activeDeckId)) {
      activeDeckId = BUILTIN_DECKS[0].id;
      SRS.setActiveDeckId(activeDeckId);
    }

    const MODES = ["home", "flashcard", "quiz", "photo", "exam", "pairs", "list"];
    function modeFromHash() {
      const h = (location.hash || "").replace("#", "");
      return MODES.includes(h) ? h : "home";
    }
    function setMode(m) {
      state.mode = m;
      const want = m === "home" ? "#home" : `#${m}`;
      if (location.hash !== want) history.replaceState(null, "", want);
      rebuildPool();
      render();
      window.scrollTo(0, 0);
    }

    let state = {
      mode: modeFromHash(),
      chapter: "ALL",
      onlyWeak: false,
      onlyDue: false,
      quizType: "random",
      pool: [],
      index: 0,
      answered: false,
      selectedOption: null,
      idkUsed: false,
      photoRevealed: false,
      flashFlipped: false,
      flashHint: false,
      flashFront: "front", // 'front' | 'back' | 'photo'
      examSet: [],
      examRevealed: {},
      searchQuery: "",
      modalTab: "create"
    };

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }
    function safeImgUrl(u) {
      const s = String(u || "").trim();
      if (!s) return "";
      if (/^images\/[A-Za-z0-9._/?=&-]+$/.test(s)) return s;
      if (/^https:\/\/[^\s"'<>]+$/i.test(s)) return s;
      if (/^data:image\/(png|jpeg|jpg|webp|gif);base64,[A-Za-z0-9+/=]+$/i.test(s)) return s;
      return "";
    }

    function getCardRec(cardId) {
      return SRS.getCardRecord(progress, getActiveDeck().id, cardId);
    }

    function getStatus(cardId) {
      return getCardRec(cardId).status;
    }

    function setSimpleStatus(cardId, st) {
      const quality = st === "mastered" ? 3 : 1;
      reviewCardWithQuality(cardId, quality);
    }

    function reviewCardWithQuality(cardId, quality) {
      const deckId = getActiveDeck().id;
      const key = SRS.cardKey(deckId, cardId);
      const cur = SRS.getCardRecord(progress, deckId, cardId);
      const goalDate = SRS.getDeckGoal(deckId);
      progress[key] = SRS.computeNextReview(cur, quality, Date.now(), goalDate);
      SRS.saveAllProgress(progress);
      renderStats();
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function getDeckChapters(deck) {
      return ["ALL", ...new Set(deck.cards.map(c => c.chapter || "일반"))];
    }

    function getFiltered() {
      const deck = getActiveDeck();
      const now = Date.now();
      return deck.cards.filter(c => {
        const ch = c.chapter || "일반";
        if (state.chapter !== "ALL" && ch !== state.chapter) return false;
        const rec = getCardRec(c.id);
        if (state.onlyWeak && rec.status === "mastered") return false;
        if (state.onlyDue && !SRS.isDue(rec, now)) return false;
        return true;
      });
    }

    function rebuildPool() {
      state.pool = shuffle(getFiltered());
      state.index = 0;
      state.answered = false;
      state.selectedOption = null;
      state.idkUsed = false;
      state.photoRevealed = false;
      state.flashFlipped = false;
    }

    function googleImgUrl(c) {
      return `https://www.google.com/search?tbm=isch&q=${encodeURIComponent((c.front || "") + " " + (c.back || ""))}`;
    }

    function openZoom(src) {
      const safe = safeImgUrl(src);
      if (!safe) return;
      document.getElementById("lightboxImg").src = safe;
      document.getElementById("lightbox").classList.add("open");
    }
    document.addEventListener("click", e => {
      const img = e.target.closest && e.target.closest("img[data-zoom]");
      if (img) openZoom(img.getAttribute("src"));
    });

    function renderMediaPane(c, hideTitle = false) {
      const src = safeImgUrl(c.img);
      if (src) {
        return `
          <div class="media-pane">
            <img src="${escapeHtml(src)}" alt="${hideTitle ? "Quiz image" : escapeHtml(c.front)}" data-zoom="1">
          </div>
        `;
      }
      return `
        <div class="media-pane">
          <div class="media-fallback">
            <div>이미지 없음 (${escapeHtml(c.front)})</div>
            <a href="${googleImgUrl(c)}" target="_blank" rel="noopener">구글 이미지 보기 ↗</a>
          </div>
        </div>
      `;
    }

    function renderStats() {
      const deck = getActiveDeck();
      const total = deck.cards.length;
      const mastered = deck.cards.filter(c => getStatus(c.id) === "mastered").length;
      const review = deck.cards.filter(c => getStatus(c.id) === "review").length;
      document.getElementById("statMastered").textContent = `암기 ${mastered}/${total}`;
      document.getElementById("statReview").textContent = `복습 ${review}`;
      const pct = total > 0 ? Math.round((mastered / total) * 100) : 0;
      document.getElementById("progressFill").style.width = `${pct}%`;
    }

    function renderDeckSelect() {
      const sel = document.getElementById("deckSelect");
      const all = getAllDecks();
      sel.innerHTML = all.map(d => `<option value="${escapeHtml(d.id)}" ${d.id === activeDeckId ? "selected" : ""}>${escapeHtml(d.title)} (${d.cards.length})</option>`).join("");
    }

    function renderModeTabs() {
      const deck = getActiveDeck();
      const tabs = [
        { id: "home", label: "홈" },
        { id: "flashcard", label: "플래시카드" },
        { id: "quiz", label: "4지선다" }
      ];
      if (deck.hasPhotoMode) tabs.push({ id: "photo", label: "사진 퀴즈" });
      if (deck.hasExamMode) tabs.push({ id: "exam", label: "실전 3문제" });
      if (deck.pairs && deck.pairs.length) tabs.push({ id: "pairs", label: `헷갈리는 ${deck.pairs.length}쌍` });
      tabs.push({ id: "list", label: `전체 ${deck.cards.length}개` });

      if (!tabs.some(t => t.id === state.mode)) {
        state.mode = "home";
      }

      const container = document.getElementById("modeTabs");
      container.innerHTML = tabs.map(t => `<button class="pill-btn ${state.mode === t.id ? "active" : ""}" data-mode="${t.id}">${t.label}</button>`).join("");
      container.querySelectorAll(".pill-btn").forEach(btn => {
        btn.addEventListener("click", () => setMode(btn.dataset.mode));
      });
    }

    function renderFilters() {
      const deck = getActiveDeck();
      const bar = document.getElementById("filtersBar");
      const lockViewport = ["photo", "flashcard", "quiz"].includes(state.mode);
      document.body.classList.toggle("viewport-fit", lockViewport);

      document.body.classList.toggle("is-home", state.mode === "home");
      if (state.mode === "pairs" || state.mode === "home") {
        bar.innerHTML = "";
        return;
      }

      const chapters = getDeckChapters(deck);
      const dueCount = deck.cards.filter(c => SRS.isDue(getCardRec(c.id))).length;
      const goalDate = SRS.getDeckGoal(deck.id);
      const plan = SRS.getStudyPlan(deck, progress, goalDate);

      let html = `<div class="filters-more">`;
      if (chapters.length > 2) {
        html += `
          <select id="chapterSelect" aria-label="단원 필터">
            ${chapters.map(c => `<option value="${escapeHtml(c)}" ${state.chapter === c ? "selected" : ""}>${c === "ALL" ? `전체 (${deck.cards.length})` : escapeHtml(c)}</option>`).join("")}
          </select>

    let cachedKey = "", cachedQ = null;
    function buildQuestion(c, type) {
      const deck = getActiveDeck();
      const others = shuffle(deck.cards.filter(x => x.id !== c.id));
      let title = "", sub = "", correct = "", opts = [], resolvedType = type;

      if (deck.kind === "architecture") {
        resolvedType = (type === "random" || !["architect", "name", "year"].includes(type))
          ? ["architect", "name", "year"][Math.floor(Math.random() * 3)]
          : type;
        if (resolvedType === "architect") {
          title = c.name; sub = `${c.year} · 건축가는?`; correct = c.architect;
          const picks = [];
          for (const o of others) if (o.architect !== correct && !picks.includes(o.architect)) { picks.push(o.architect); if (picks.length === 3) break; }
          opts = shuffle([correct, ...picks]);
        } else if (resolvedType === "name") {
          title = `${c.architect} (${c.year})`; sub = c.desc; correct = c.name;
          opts = shuffle([correct, ...others.slice(0, 3).map(o => o.name)]);
        } else if (resolvedType === "year") {
          title = c.name; sub = `${c.architect} · 슬라이드 기준 연도는?`; correct = c.year;
          const picks = [];
          for (const o of others) if (o.year !== correct && !picks.includes(o.year)) { picks.push(o.year); if (picks.length === 3) break; }
          opts = shuffle([correct, ...picks]);
        } else {
          title = c.name; sub = `${c.architect} · 장소는?`; correct = c.location;
          const picks = [];
          for (const o of others) if (o.location !== correct && !picks.includes(o.location)) { picks.push(o.location); if (picks.length === 3) break; }
          opts = shuffle([correct, ...picks]);
        }
      } else {
        if (type === "back2front") {
          title = c.back;
          sub = "해당하는 앞면(질문/단어)은?";
          correct = c.front;
          const picks = [];
          for (const o of others) if (o.front !== correct && !picks.includes(o.front)) { picks.push(o.front); if (picks.length === 3) break; }
          opts = shuffle([correct, ...picks]);
        } else {
          title = c.front;
          sub = "알맞은 뜻(정답)을 고르세요";
          correct = c.back;
          const picks = [];
          for (const o of others) if (o.back !== correct && !picks.includes(o.back)) { picks.push(o.back); if (picks.length === 3) break; }
          opts = shuffle([correct, ...picks]);
        }
      }
      return { title, sub, correct, opts, resolvedType };
    }

    function renderQuiz(main) {
      const deck = getActiveDeck();
      if (state.pool.length === 0) rebuildPool();
      if (state.pool.length === 0) {
        main.innerHTML = `<div class="split-card no-media"><p>조건에 맞는 카드가 없습니다.</p></div>`;
        return;
      }
      if (deck.cards.length < 2) {
        main.innerHTML = `<div class="split-card no-media"><p>4지선다 퀴즈를 진행하려면 최소 2장 이상의 카드가 필요합니다.</p></div>`;
        return;
      }

      const idx = state.index % state.pool.length;
      const c = state.pool[idx];
      const key = `${deck.id}-${c.id}-${state.quizType}-${idx}`;
      if (cachedKey !== key) { cachedKey = key; cachedQ = buildQuestion(c, state.quizType); }
      const q = cachedQ;
      const hasMedia = !!c.img;

      main.innerHTML = `
        <div class="split-card ${hasMedia ? "" : "no-media"}">
          ${hasMedia ? renderMediaPane(c, q.resolvedType === "name" && !state.answered) : ""}
          <div class="content-pane">
            <div class="content-scroll">
              <div class="card-top">
                <span class="chapter-badge">${escapeHtml(c.chapter || "일반")}</span>
                <span class="counter">${idx + 1} / ${state.pool.length}</span>
              </div>
              <h2 class="project-title">${escapeHtml(q.title)}</h2>
              <p class="sub-hint">${escapeHtml(q.sub)}</p>
              <div class="options-grid">
                ${q.opts.map((opt, i) => {
                  let cls = "option-btn";
                  if (state.answered) {
                    if (opt === q.correct) cls += " correct";
                    else if (opt === state.selectedOption) cls += " wrong";
                  }
                  return `<button class="${cls}" data-opt="${i}" ${state.answered ? "disabled" : ""}><span class="option-key">${i + 1}</span><span>${escapeHtml(opt)}</span></button>`;
                }).join("")}
                ${!state.answered ? `
                  <button class="option-btn idk-btn" id="qIdkBtn">모르겠음 · 정답 바로 보기 (Space / 0)</button>
                ` : ""}
              </div>
              ${state.answered ? `<div style="margin-top:10px;">${renderAnswerBlock(c)}</div>` : ""}
            </div>
            <div>
              <div class="card-actions">
                <div style="display:flex;gap:6px;">
                  <button class="btn ${getStatus(c.id) === "mastered" ? "ok" : ""}" id="qOk">암기</button>
                  <button class="btn ${getStatus(c.id) === "review" ? "bad" : ""}" id="qBad">복습</button>
                </div>
                <div style="display:flex;gap:6px;">
                  <button class="btn" id="qPrev">←</button>
                  <button class="btn primary" id="qNext">다음 →</button>
                </div>
              </div>
              <div class="kbd-hint">1–4 보기 선택 · Space/0 모르겠음 · Enter/→ 다음</div>
            </div>
          </div>
        </div>
      `;

      main.querySelectorAll("[data-opt]").forEach(btn => {
        btn.addEventListener("click", () => {
          if (state.answered) return;
          const chosen = q.opts[Number(btn.dataset.opt)];
          state.selectedOption = chosen;
          state.answered = true;
          state.idkUsed = false;
          if (chosen === q.correct) {
            if (getStatus(c.id) === "new") setSimpleStatus(c.id, "mastered");
          } else {
            setSimpleStatus(c.id, "review");
          }
          renderMain();
        });
      });
      document.getElementById("qIdkBtn")?.addEventListener("click", () => {
        if (state.answered) return;
        state.selectedOption = null;
        state.idkUsed = true;
        state.answered = true;
        setSimpleStatus(c.id, "review");
        renderMain();
      });
      document.getElementById("qOk")?.addEventListener("click", () => { setSimpleStatus(c.id, "mastered"); renderMain(); });
      document.getElementById("qBad")?.addEventListener("click", () => { setSimpleStatus(c.id, "review"); renderMain(); });
      document.getElementById("qPrev")?.addEventListener("click", () => {
        state.index = (state.index - 1 + state.pool.length) % state.pool.length;
        state.answered = false; state.selectedOption = null; state.idkUsed = false;
        renderMain();
      });
      document.getElementById("qNext")?.addEventListener("click", () => {
        state.index = (state.index + 1) % state.pool.length;
        state.answered = false; state.selectedOption = null; state.idkUsed = false;
        renderMain();
      });
    }

    function renderExam(main) {
      const deck = getActiveDeck();
      if (state.examSet.length === 0) {
        const src = getFiltered();
        state.examSet = shuffle(src.length >= 3 ? src : deck.cards).slice(0, 3);
      }
      main.innerHTML = `
        <div class="grid-list">
          ${state.examSet.map((c, idx) => {
            const rev = !!state.examRevealed[c.id];
            return `
              <div class="exam-card">
                <div class="card-top">
                  <span class="chapter-badge">시험 1번 · 문제 ${idx + 1}/3</span>
                  <span class="counter">${rev ? escapeHtml(c.chapter) : ""}</span>
                </div>
                <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;align-items:start;">
                  ${renderMediaPane(c, !rev)}
                  <div>
                    <h2 class="project-title">${rev ? escapeHtml(c.name) : "이 건물은?"}</h2>
                    <div class="field-stack">
                      <div class="field-row"><label>Projet</label><input type="text" placeholder="건물 이름"></div>
                      <div class="field-row"><label>Architecte</label><input type="text" placeholder="건축가"></div>
                      <div class="field-row"><label>Date</label><input type="text" placeholder="연도 (슬라이드)"></div>
                    </div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                      <button class="btn primary" data-rev="${escapeHtml(c.id)}">${rev ? "정답 접기" : "정답 확인"}</button>
                      ${rev ? `
                        <button class="btn ${getStatus(c.id) === "mastered" ? "ok" : ""}" data-ex-ok="${escapeHtml(c.id)}">암기</button>
                        <button class="btn ${getStatus(c.id) === "review" ? "bad" : ""}" data-ex-bad="${escapeHtml(c.id)}">복습</button>
                      ` : ""}
                    </div>
                  </div>
                </div>
                ${rev ? `<div style="margin-top:12px;">${renderAnswerBlock(c)}</div>` : ""}
              </div>
            `;
          }).join("")}
        </div>
      `;
      main.querySelectorAll("[data-rev]").forEach(b => b.addEventListener("click", () => {
        const id = b.dataset.rev;
        state.examRevealed[id] = !state.examRevealed[id];
        renderMain();
      }));
      main.querySelectorAll("[data-ex-ok]").forEach(b => b.addEventListener("click", () => { setSimpleStatus(b.dataset.exOk, "mastered"); renderMain(); }));
      main.querySelectorAll("[data-ex-bad]").forEach(b => b.addEventListener("click", () => { setSimpleStatus(b.dataset.exBad, "review"); renderMain(); }));
    }

    function renderPairs(main) {
      const deck = getActiveDeck();
      const pairs = deck.pairs || [];
      main.innerHTML = `<div class="pairs-grid">${pairs.map(x => `<div class="pair-card"><h3>${escapeHtml(x.title)}</h3><p>${escapeHtml(x.body)}</p></div>`).join("")}</div>`;
    }

    function renderList(main) {
      const deck = getActiveDeck();
      const q = state.searchQuery.trim().toLowerCase();
      const items = getFiltered().filter(c => {
        if (!q) return true;
        return [c.front, c.back, c.sub, c.desc, c.koTip, c.chapter].join(" ").toLowerCase().includes(q);
      });

      const showThumb = deck.cards.some(c => !!c.img);

      main.innerHTML = `
        <div class="grid-list">
          ${items.map((c, idx) => {
            const st = getStatus(c.id);
            const rec = getCardRec(c.id);
            const dueText = rec.interval > 0 ? ` · 다음 복습 ${SRS.formatInterval(rec.interval)}` : "";
            return `
              <div class="list-row ${showThumb ? "" : "no-thumb"}">
                ${showThumb ? `
                  <div class="list-thumb">
                    ${safeImgUrl(c.img) ? `<img src="${escapeHtml(safeImgUrl(c.img))}" alt="${escapeHtml(c.front)}" loading="lazy" data-zoom="1">` : `<a href="${googleImgUrl(c)}" target="_blank" rel="noopener">구글 이미지 ↗</a>`}
                  </div>
                ` : ""}
                <div>
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
                    <div><span class="chapter-badge" style="margin-right:6px;">${escapeHtml(c.chapter || "일반")}</span><strong>${idx + 1}. ${escapeHtml(c.front)}</strong></div>
                    <div style="display:flex;align-items:center;gap:6px;">
                      ${!deck.builtin ? `<label class="btn sm" style="cursor:pointer;min-height:30px;padding:3px 10px;font-size:12px;">${c.img ? "사진 변경" : "+ 사진"}<input type="file" data-card-img="${escapeHtml(c.id)}" accept="image/png,image/jpeg,image/webp" style="display:none;"></label>` : ""}
                      <select data-st-id="${escapeHtml(c.id)}" style="min-height:30px;padding:3px 10px;border-radius:980px;border:1px solid var(--line);background:var(--surface);font-size:12px;font-weight:600;">
                        <option value="new" ${st === "new" ? "selected" : ""}>미학습</option>
                        <option value="review" ${st === "review" ? "selected" : ""}>복습${dueText}</option>
                        <option value="mastered" ${st === "mastered" ? "selected" : ""}>암기${dueText}</option>
                      </select>
                      ${!deck.builtin ? `<button type="button" class="btn sm bad" data-card-del="${escapeHtml(c.id)}" style="min-height:30px;padding:3px 8px;font-size:12px;" title="카드 삭제">✕</button>` : ""}
                    </div>
                  </div>
                  <div style="font-size:13.5px;color:var(--muted);margin:4px 0;"><strong>${escapeHtml(c.back)}</strong>${c.sub ? ` · ${escapeHtml(c.sub)}` : ""}</div>
                  ${c.desc && c.desc !== c.back ? `<div style="font-size:13.5px;">${escapeHtml(c.desc)}</div>` : ""}
                  ${c.koTip ? `<div style="font-size:12.5px;color:var(--muted);margin-top:4px;">↳ ${escapeHtml(c.koTip)}</div>` : ""}
                </div>
              </div>
            `;
          }).join("")}
        </div>
      `;
      main.querySelectorAll("[data-st-id]").forEach(sel => sel.addEventListener("change", e => {
        const val = e.target.value;
        const id = sel.dataset.stId;
        if (val === "new") {
          delete progress[SRS.cardKey(deck.id, id)];
          SRS.saveAllProgress(progress);
          renderStats();
        } else {
          setSimpleStatus(id, val);
        }
      }));
      main.querySelectorAll("[data-card-img]").forEach(inp => inp.addEventListener("change", async e => {
        const file = e.target.files?.[0];
        if (!file) return;
        const card = deck.cards.find(x => x.id === inp.dataset.cardImg);
        if (!card) return;
        try {
          card.img = await resizeCardImage(file);
          deck.updatedAt = Date.now();
          saveDecksAndSync();
          render();
        } catch { alert("이미지를 읽지 못했습니다."); }
      }));
      main.querySelectorAll("[data-card-del]").forEach(btn => btn.addEventListener("click", () => {
        if (!confirm("이 카드를 삭제할까요?")) return;
        deck.cards = deck.cards.filter(x => x.id !== btn.dataset.cardDel);
        deck.updatedAt = Date.now();
        saveDecksAndSync();
        rebuildPool();
        render();
      }));
    }

    function renderHome(main) {
      const deck = getActiveDeck();
      const total = deck.cards.length;
      const mastered = deck.cards.filter(c => getStatus(c.id) === "mastered").length;
      const due = deck.cards.filter(c => SRS.isDue(getCardRec(c.id))).length;
      const goal = SRS.getDeckGoal(deck.id);
      const plan = SRS.getStudyPlan(deck, progress, goal);
      const isArch = deck.kind === "architecture";
      const items = [
        { id: "flashcard", t: "플래시카드", d: isArch ? "사진을 보고 떠올린 뒤 뒤집어 확인. 다시·어려움·알맞음·쉬움으로 복습 간격이 정해집니다." : "앞면을 보고 떠올린 뒤 뒤집어 확인합니다.", rec: true },
        { id: "quiz", t: "4지선다", d: isArch ? "건물 이름 · 건축가 · 연도 중 하나를 4개 보기에서 고릅니다." : "4개 보기 중 정답을 고릅니다." },
      ];
      if (deck.hasPhotoMode) items.push({ id: "photo", t: "사진 퀴즈", d: "사진만 보고 답을 떠올린 다음 정답을 열어 스스로 채점합니다." });
      if (deck.hasExamMode) items.push({ id: "exam", t: "실전 3문제", d: "시험 1번처럼 사진 3장을 보고 건물 이름 · 건축가 · 연도를 직접 씁니다." });
      if (deck.pairs && deck.pairs.length) items.push({ id: "pairs", t: `헷갈리는 ${deck.pairs.length}쌍`, d: "같은 연도, 같은 건축가처럼 자주 섞이는 것들을 나란히 봅니다." });
      items.push({ id: "list", t: `전체 ${total}개`, d: "모든 카드를 한 번에 훑어보고 검색합니다." });

      const isExample = !!deck.builtin;
      main.innerHTML = `
        <section class="home" aria-labelledby="homeTitle">
          <p class="home-eyebrow">Atelier 4·2 · Quiz</p>
          <h1 id="homeTitle">${isExample ? "나만의 플래시카드" : escapeHtml(deck.title)}</h1>
          <p class="home-sub">${isExample ? "앞면·뒷면으로 카드를 만들어 반복 암기합니다. 기본 덱은 예시로 제공됩니다." : escapeHtml(deck.subtitle || "앞면을 보고 떠올린 뒤 뒤집어 확인하세요.")}</p>
          <div class="home-deck">
            <select class="deck-select" id="homeDeckSelect" aria-label="학습 덱 선택">
              ${getAllDecks().map(d => `<option value="${escapeHtml(d.id)}" ${d.id === deck.id ? "selected" : ""}>${escapeHtml(d.title)} (${d.cards.length})</option>`).join("")}
            </select>
            <button class="btn sm primary" id="homeDeckBtn">+ 새 덱 만들기</button>
            <button class="btn sm" id="homeDriveBtn">${quizCloudUser ? "Drive 연결됨 ●" : "Drive 로그인"}</button>
          </div>
          <div class="home-stats">
            <div class="home-stat"><b>${mastered}/${total}</b><span>암기</span></div>
            <div class="home-stat"><b>${due}</b><span>오늘 복습</span></div>
            <div class="home-stat"><b>${plan.daysRemaining !== null ? `D-${plan.daysRemaining}` : "—"}</b><span>${plan.daysRemaining !== null ? `하루 ${plan.dailyRecommended}장` : "목표일 없음"}</span></div>
          </div>
          <ul class="home-cards">
            ${items.map((it, i) => `
              <li class="home-card ${it.rec ? "rec" : ""}">
                <p class="home-card-num">${String(i + 1).padStart(2, "0")}</p>
                ${it.rec ? `<span class="home-card-tag">먼저</span>` : ""}
                <h2>${it.t}</h2>
                <p class="d">${it.d}</p>
                <button type="button" data-go="${it.id}">시작하기 ›</button>
              </li>`).join("")}
          </ul>
          <p class="home-note">${quizCloudUser ? "내 덱은 Google Drive에 자동 저장·동기화됩니다. (기본 덱은 예시로 유지)" : "로그인하지 않으면 내 덱은 이 브라우저에만 저장됩니다. Google 로그인 시 Drive에 자동 저장됩니다."}</p>
        </section>
      `;
      main.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => setMode(b.dataset.go)));
      document.getElementById("homeDeckSelect").addEventListener("change", e => {
        const sel = document.getElementById("deckSelect");
        sel.value = e.target.value;
        sel.dispatchEvent(new Event("change"));
      });
      document.getElementById("homeDeckBtn").addEventListener("click", () => document.getElementById("openDeckModalBtn").click());
      document.getElementById("homeDriveBtn").addEventListener("click", () => handleQuizDriveClick());
    }

    function renderMain() {
      const main = document.getElementById("mainView");
      if (state.mode === "home") renderHome(main);
      else if (state.mode === "photo") renderPhotoQuiz(main);
      else if (state.mode === "flashcard") renderFlashcard(main);
      else if (state.mode === "quiz") renderQuiz(main);
      else if (state.mode === "exam") renderExam(main);
      else if (state.mode === "pairs") renderPairs(main);
      else renderList(main);
    }

    function render() {
      renderDeckSelect();
      renderStats();
      renderModeTabs();
      renderFilters();
      renderMain();
    }

    /* ===== Deck Manager Modal ===== */
    function openDeckModal(tab = "create") {
      state.modalTab = tab;
      document.getElementById("deckModal").classList.add("open");
      renderDeckModal();
    }

    function closeDeckModal() {
      document.getElementById("deckModal").classList.remove("open");
    }

    function renderDeckModal() {
      const deck = getActiveDeck();
      const tabs = document.getElementById("modalTabs");
      tabs.querySelectorAll(".pill-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.mtab === state.modalTab);
      });

      const body = document.getElementById("modalBody");
      if (state.modalTab === "create") {
        body.innerHTML = `
          <div class="field-stack">
            <div class="field-row">
              <label>새 덱 이름</label>
              <input type="text" id="newDeckTitle" placeholder="예: 프랑스어 건축 용어 / 영단어 100">
            </div>
            <div class="field-row">
              <label>설명 (선택)</label>
              <input type="text" id="newDeckSub" placeholder="예: 기말고사 대비 핵심 단어장">
            </div>
            <div class="field-row">
              <label>엑셀(.xlsx) · CSV 파일로 바로 불러오기 (Anki / Quizlet 방식)</label>
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <label class="btn sm" style="cursor:pointer;">
                  엑셀 / CSV 파일 선택
                  <input type="file" id="excelDeckFile" accept=".xlsx,.xls,.csv,.tsv,.txt" style="display:none;">
                </label>
                <span id="excelFileStatus" style="font-size:12px;color:var(--muted);">1열: 앞면 · 2열: 뒷면 · 3열: 메모(선택) · 4열: 단원(선택)</span>
              </div>
            </div>
            <div class="field-row">
              <label>또는 텍스트 대량 입력 (한 줄에 카드 1장: 앞면 [Tab 또는 ; 또는 -] 뒷면 | 힌트)</label>
              <textarea id="bulkCardsInput" rows="6" placeholder="la façade ; 입면, 파사드 | 건물 외관
le plan ; 평면도
l'élévation ; 입면도
la coupe ; 단면도"></textarea>
            </div>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;">
            <span id="bulkPreviewCount" style="font-size:12.5px;color:var(--muted);">0장 인식됨 · ${quizCloudUser ? "Google Drive에 자동 저장" : "이 브라우저에 저장"}</span>
            <button class="btn primary" id="createDeckSubmitBtn">덱 생성하고 바로 학습하기</button>
          </div>
        `;

        const ta = document.getElementById("bulkCardsInput");
        const countEl = document.getElementById("bulkPreviewCount");
        let uploadedExcelCards = null;
        const updateCount = n => { countEl.textContent = `${n}장 인식됨 · ${quizCloudUser ? "Google Drive에 자동 저장" : "이 브라우저에 저장"}`; };
        ta.addEventListener("input", () => {
          uploadedExcelCards = null;
          updateCount(parseBulkText(ta.value).length);
        });
        document.getElementById("excelDeckFile").addEventListener("change", async e => {
          const file = e.target.files?.[0];
          if (!file) return;
          const stEl = document.getElementById("excelFileStatus");
          stEl.textContent = "파일을 읽는 중…";
          try {
            const parsed = await parseSpreadsheetFile(file);
            uploadedExcelCards = parsed;
            if (!document.getElementById("newDeckTitle").value.trim()) {
              document.getElementById("newDeckTitle").value = file.name.replace(/\.[^.]+$/, "");
            }
            ta.value = parsed.map(c => `${c.front}\t${c.back}${c.koTip ? " | " + c.koTip : ""}`).join("\n");
            stEl.textContent = `${file.name} (${parsed.length}장 불러옴)`;
            updateCount(parsed.length);
          } catch (err) {
            stEl.textContent = "파일을 읽지 못했습니다. (.xlsx / .csv 확인)";
          }
        });
        document.getElementById("createDeckSubmitBtn").addEventListener("click", () => {
          const title = document.getElementById("newDeckTitle").value.trim();
          const subtitle = document.getElementById("newDeckSub").value.trim();
          const cards = uploadedExcelCards && uploadedExcelCards.length ? uploadedExcelCards : parseBulkText(ta.value);
          if (!title) { alert("덱 이름을 입력해 주세요."); return; }
          if (cards.length === 0) { alert("최소 1장 이상의 카드를 입력하거나 엑셀/CSV 파일을 올려 주세요."); return; }

          const newDeck = {
            id: `custom_${Date.now()}`,
            title,
            subtitle,
            kind: "general",
            builtin: false,
            updatedAt: Date.now(),
            cards
          };
          customDecks.push(newDeck);
          saveDecksAndSync();

          SRS.setActiveDeckId(activeDeckId);

          state.flashFront = "front";
          state.quizType = "front2back";
          rebuildPool();
          closeDeckModal();
          render();
        });
      } else if (state.modalTab === "addcard") {

            <div class="field-row"><label>단원 / 태그</label><input type="text" id="addCardCh" value="일반"></div>

            <div class="field-row"><label>뒷면 (정답 / 뜻)</label><input type="text" id="addCardBack" placeholder="뒷면 내용"></div>
            <div class="field-row"><label>암기 팁 / 메모 (선택)</label><input type="text" id="addCardTip" placeholder="예: 헷갈리는 포인트"></div>
            <div class="field-row"><label>이미지 첨부 (선택)</label><input type="file" id="addCardImg" accept="image/png,image/jpeg,image/webp"></div>
          </div>
          <button class="btn primary" id="addCardSubmitBtn">카드 추가</button>
        `;
        document.getElementById("addCardSubmitBtn").addEventListener("click", async () => {
          const front = document.getElementById("addCardFront").value.trim();
          const back = document.getElementById("addCardBack").value.trim();
          const tip = document.getElementById("addCardTip").value.trim();
          const chapter = document.getElementById("addCardCh").value.trim() || "일반";
          const imgFile = document.getElementById("addCardImg").files?.[0] || null;
          if (!front || !back) { alert("앞면과 뒷면을 모두 입력해 주세요."); return; }
          let imgData = "";
          if (imgFile) { try { imgData = await resizeCardImage(imgFile); } catch {} }
          deck.cards.push({
            id: `c_${Date.now()}`,

            front,
            back,
            sub: "",

            koTip: tip,

          });

          rebuildPool();
          render();

          document.getElementById("addCardBack").value = "";
          document.getElementById("addCardTip").value = "";
          document.getElementById("addCardImg").value = "";
          alert("카드가 추가되었습니다!");
        });
      } else {
        body.innerHTML = `
          <div class="grid-list">
            ${getAllDecks().map(d => `
              <div class="deck-item-row">
                <div>
                  <strong>${escapeHtml(d.title)}</strong>
                  <div style="font-size:12px;color:var(--muted);">${d.cards.length}장 · ${d.builtin ? "기본 제공" : "사용자 덱"}</div>
                </div>
                <div style="display:flex;gap:6px;">
                  <button class="btn sm" data-export-deck="${escapeHtml(d.id)}">JSON 백업</button>
                  ${!d.builtin ? `<button class="btn sm bad" data-del-deck="${escapeHtml(d.id)}">삭제</button>` : ""}
                </div>
              </div>
            `).join("")}
          </div>
          <div style="border-top:1px solid var(--line);padding-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">

              <input type="file" id="importDeckFile" accept=".json" style="display:none;">
            </label>
            <span style="font-size:12px;color:var(--muted);">내보낸 .json 파일을 불러와 다른 기기와 공유할 수 있습니다.</span>
          </div>
        `;
        body.querySelectorAll("[data-export-deck]").forEach(btn => {
          btn.addEventListener("click", () => {
            const target = getAllDecks().find(x => x.id === btn.dataset.exportDeck);
            if (!target) return;
            const blob = new Blob([JSON.stringify(target, null, 2)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `${target.id}.json`;
            a.click();
            URL.revokeObjectURL(url);
          });
        });
        body.querySelectorAll("[data-del-deck]").forEach(btn => {
          btn.addEventListener("click", () => {
            if (!confirm("이 덱을 삭제할까요?")) return;
            customDecks = customDecks.filter(x => x.id !== btn.dataset.delDeck);
            saveDecksAndSync();
            if (activeDeckId === btn.dataset.delDeck) {
              activeDeckId = BUILTIN_DECKS[0].id;
              SRS.setActiveDeckId(activeDeckId);
            }
            rebuildPool();
            render();
            renderDeckModal();
          });
        });
        document.getElementById("importDeckFile")?.addEventListener("change", e => {
          const file = e.target.files?.[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const imported = JSON.parse(reader.result);
              if (!imported.title || !Array.isArray(imported.cards)) throw new Error("Invalid deck");
              imported.id = `custom_${Date.now()}`;
              imported.builtin = false;
              imported.updatedAt = Date.now();
              imported.cards = imported.cards.map(c => ({ ...c, img: safeImgUrl(c.img) }));
              customDecks.push(imported);
              saveDecksAndSync();
              activeDeckId = imported.id;
              SRS.setActiveDeckId(activeDeckId);
              rebuildPool();
              render();
              renderDeckModal();
            } catch {
              alert("올바른 덱 JSON 파일이 아닙니다.");
            }
          };
          reader.readAsText(file);
        });
      }
    }

    document.getElementById("deckSelect").addEventListener("change", e => {
      activeDeckId = e.target.value;
      SRS.setActiveDeckId(activeDeckId);
      state.chapter = "ALL";
      state.examSet = [];
      state.flashFront = getActiveDeck().cards.some(c => !!c.img) ? "photo" : "front";
      state.quizType = getActiveDeck().kind === "architecture" ? "random" : "front2back";
      rebuildPool();
      render();
    });

    document.getElementById("openDeckModalBtn").addEventListener("click", () => openDeckModal("create"));
    document.getElementById("btnQuizDrive").addEventListener("click", handleQuizDriveClick);
    initQuizCloud();
    document.getElementById("closeDeckModalBtn").addEventListener("click", closeDeckModal);
    document.getElementById("deckModal").addEventListener("click", e => {
      if (e.target.id === "deckModal") closeDeckModal();
    });
    document.getElementById("modalTabs").querySelectorAll(".pill-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        state.modalTab = btn.dataset.mtab;
        renderDeckModal();
      });
    });

    document.addEventListener("keydown", e => {
      if (e.key === "Escape") {
        document.getElementById("lightbox").classList.remove("open");
        closeDeckModal();
      }
      if (document.getElementById("deckModal").classList.contains("open")) return;
      if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA" || e.target.tagName === "SELECT") return;

      if (state.mode === "photo") {
        if (e.code === "Space") { e.preventDefault(); document.getElementById("revealPhotoBtn")?.click(); }
        else if (["1", "2", "3", "4"].includes(e.key)) document.getElementById(`pQ${e.key}`)?.click();
        else if (e.key === "ArrowRight") document.getElementById("pNext")?.click();
        else if (e.key === "ArrowLeft") document.getElementById("pPrev")?.click();
      } else if (state.mode === "flashcard") {
        if (e.code === "Space") { e.preventDefault(); document.getElementById("quizletStage")?.click(); }
        else if (["1", "2", "3", "4"].includes(e.key)) document.getElementById(`fcQ${e.key}`)?.click();
        else if (e.key === "ArrowRight") document.getElementById("fcNext")?.click();
        else if (e.key === "ArrowLeft") document.getElementById("fcPrev")?.click();
      } else if (state.mode === "quiz") {
        if (["1", "2", "3", "4"].includes(e.key) && !state.answered) document.querySelector(`[data-opt="${Number(e.key) - 1}"]`)?.click();
        else if ((e.code === "Space" || e.key === "0") && !state.answered) { e.preventDefault(); document.getElementById("qIdkBtn")?.click(); }
        else if (e.key === "Enter" || e.key === "ArrowRight") document.getElementById("qNext")?.click();
        else if (e.key === "ArrowLeft") document.getElementById("qPrev")?.click();
      }
    });

    // Initialize default front mode based on active deck
    state.flashFront = getActiveDeck().cards.some(c => !!c.img) ? "photo" : "front";
    state.quizType = getActiveDeck().kind === "architecture" ? "random" : "front2back";
    window.addEventListener("hashchange", () => {
      const m = modeFromHash();
      if (m !== state.mode) { state.mode = m; rebuildPool(); render(); window.scrollTo(0, 0); }
    });
    rebuildPool();
    render();
  </script>
</body>
</html>
